# Actualizaciones de dependencias cada semana. Los PR van a Alejodev (la rama de pruebas):
# ahí corren las pruebas y, si todo va bien, llegan a main con el PR de siempre.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: Alejodev
    # requirements.txt usa mínimos (>=) que ya admiten las versiones nuevas: solo se propone algo
    # cuando una versión queda fuera del rango, no para subir el mínimo de cada paquete.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
    groups:
      python-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: Alejodev
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: Alejodev
    schedule:
      interval: weekly
      day: monday
    groups:
      acciones:
        patterns: ["*"]
