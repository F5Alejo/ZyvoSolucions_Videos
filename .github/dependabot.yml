# Actualizaciones de dependencias cada semana. Los PR van a develop (la rama de integración):
# ahí corren las pruebas y llegan a main con la siguiente release.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: develop
    # requirements.txt usa mínimos (>=) que ya admiten las versiones nuevas: solo se propone algo
    # cuando una versión queda fuera del rango, no para subir el mínimo de cada paquete.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
    groups:
      python-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: develop
    ignore:
      # vue-tsc todavía no funciona con TypeScript 7 (ERR_PACKAGE_PATH_NOT_EXPORTED «./lib/tsc»).
      # Quitar cuando vue-tsc lo soporte.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    groups:
      acciones:
        patterns: ["*"]
