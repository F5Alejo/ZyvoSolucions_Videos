# Pruebas del estudio en cada cambio.
#
# - Alejodev y juandev son las ramas de trabajo: cada push corre todo.
# - main es la versión estable: cada push y cada pull request hacia main corren todo.
# - Todos los pull request se prueban, sin importar la rama de destino: cuando el filtro
#   era [main, Alejodev], el trabajo de juandev llegó a integrarse sin pasar por ruff.
#   main solo se actualiza cuando estas pruebas pasan.

name: Pruebas

on:
  push:
    branches: [main, Alejodev, juandev]
  pull_request:  # sin filtro de ramas: ningún PR se integra sin pruebas
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-y-motor:
    name: API y motor (pytest)
    runs-on: ubuntu-24.04  # fijo: ubuntu-latest pasa a Ubuntu 26 el 19-oct-2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # La versión estática de ffmpeg (un solo archivo): apt-get se colgó más de 20 min en la
      # primera ejecución. Si la descarga falla, se intenta con apt, con tiempo límite.
      - name: ffmpeg
        timeout-minutes: 8
        run: |
          set -e
          if curl -fsSL --retry 3 --max-time 180 -o /tmp/ffmpeg.tar.xz                https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz; then
            mkdir -p "$HOME/ffmpeg" && tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
            echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          else
            sudo timeout 300 apt-get update && sudo timeout 300 apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: ffmpeg instalado
        run: ffmpeg -version | head -1

      - name: Librerías de Python
        timeout-minutes: 10
        run: pip install -r requirements.txt

      - name: Caché de Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Navegador que dibuja las escenas (Chromium)
        timeout-minutes: 10
        # Las imágenes de Ubuntu de GitHub ya traen las librerías de Chrome; --with-deps (que usa apt)
        # queda solo de respaldo.
        run: python -m playwright install chromium || python -m playwright install --with-deps chromium

      # Las pruebas usan una voz de prueba y Ollama simulado: no hacen falta modelos ni claves.
      - name: pytest
        env:
          GUARDAR_MUESTRA: ${{ runner.temp }}/muestra
        run: python -m pytest -q

      # El video que produjo la prueba de punta a punta, para verlo desde la página de Actions.
      - name: Video de muestra
        uses: actions/upload-artifact@v7
        with:
          name: video-de-muestra
          path: ${{ runner.temp }}/muestra/
          retention-days: 14
          if-no-files-found: error

  estilo:
    name: Estilo (ruff)
    runs-on: ubuntu-24.04  # fijo: ubuntu-latest pasa a Ubuntu 26 el 19-oct-2026
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Las reglas están en pyproject.toml ([tool.ruff]).
      - run: ruff check --output-format=github .

  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-24.04  # fijo: ubuntu-latest pasa a Ubuntu 26 el 19-oct-2026
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # toda la historia: una clave borrada sigue en los commits viejos
      # Cuenta personal: no necesita licencia (GITLEAKS_LICENSE solo para organizaciones).
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  interfaz:
    name: Interfaz (tipos, Vitest y compilación)
    runs-on: ubuntu-24.04  # fijo: ubuntu-latest pasa a Ubuntu 26 el 19-oct-2026
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Tipos (vue-tsc)
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Compilación
        run: npm run build
