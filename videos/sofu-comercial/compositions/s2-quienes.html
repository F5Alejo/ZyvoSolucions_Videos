  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* 0.0 · the white card springs open from the middle of the frame */
      tl.fromTo("#q-card", { scaleY: 0.04, scaleX: 0.5 }, { scaleY: 1, scaleX: 1, duration: 0.45, ease: "expo.out" }, 0);
      /* 0.5 · the lockup is revealed by a wipe over the whole official file — never redrawn */
      tl.fromTo("#q-logo", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power3.out" }, 0.5);

      /* 1.5 · what the company does, word by word */
      var words = gsap.utils.toArray("#q-l1 .q-w");
      for (var i = 0; i < words.length; i++) {
        tl.set(words[i], { opacity: 1 }, 1.5 + i * 0.07);
        tl.fromTo(words[i], { y: 40 }, { y: 0, duration: 0.35, ease: "power4.out" }, 1.5 + i * 0.07);
      }
      /* 2.5 · where it is */
      tl.fromTo("#q-l2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.5);

      /* 3.5-4.5 · the three chips arrive from depth, one per half beat */
      var chips = gsap.utils.toArray("#q-chips .q-chip");
      for (var k = 0; k < chips.length; k++) {
        tl.set(chips[k], { opacity: 1 }, 3.5 + k * 0.5);
        tl.fromTo(chips[k], { z: -600, rotationX: -35, transformPerspective: 1000, transformOrigin: "50% 100%" },
          { z: 0, rotationX: 0, duration: 0.5, ease: "power4.out" }, 3.5 + k * 0.5);
      }

      /* 5.5 · the BIC commitment */
      tl.fromTo("#q-bic", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.5);

      /* 6.5 · a slow push keeps the card alive while the copy holds */
      tl.fromTo("#q-card", { scale: 1 }, { scale: 1.02, duration: 2.4, ease: "sine.inOut", immediateRender: false }, 6.5);

      /* 9.2 · exit: paper blocks close the frame for scene 3 */
      var blocks = gsap.utils.toArray("#q-exit .q-block");
      for (var q = 0; q < blocks.length; q++) {
        tl.fromTo(blocks[q], { scaleY: 0 }, { scaleY: 1, duration: 0.32, ease: "power3.in" }, 9.2 + q * 0.04);
