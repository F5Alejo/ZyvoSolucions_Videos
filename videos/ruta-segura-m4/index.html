<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #101B33; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #101B33; }
      .escena { position: absolute; inset: 0; width: 100%; height: 100%; }
      .chrome { position: absolute; inset: 0; pointer-events: none; }
      /* sello de marca: archivo oficial sobre pastilla blanca, legible sobre el azul noche */
      .sello { position: absolute; right: 118px; bottom: 24px; width: 186px; height: 62px;
                border-radius: 34px; background: #FFFFFF; }
      .sello img { position: absolute; left: 20px; top: 9px; width: 120px; height: 45px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="128.0"
         data-width="1920" data-height="1080">
      <div id="el-e32" class="escena" data-composition-id="e32-cierre"
           data-composition-src="compositions/e32-cierre.html"
           data-start="0" data-duration="50.5" data-track-index="1"></div>
      <div id="el-e33" class="escena" data-composition-id="e33-fuentes"
           data-composition-src="compositions/e33-fuentes.html"
           data-start="50.5" data-duration="67.5" data-track-index="1"></div>
      <div id="el-e34" class="escena" data-composition-id="e34-fin"
           data-composition-src="compositions/e34-fin.html"
           data-start="118" data-duration="10" data-track-index="1"></div>
      <div id="chrome" class="clip chrome" data-start="0" data-duration="128.0" data-track-index="6">
        <div class="sello" id="sello"><img src="assets/marca/riskmann_logo_color.png" alt="RiskMann by SOFU" /></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
