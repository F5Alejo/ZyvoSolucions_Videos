  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="08-lo-que-cambia"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(root.querySelectorAll(sel));
      };

      var tl = gsap.timeline({ paused: true });

      /* ---- una sola rejilla de tempo: todo lee de aquí ---- */
      var PULSE = 0.2;
      var BEATS = [PULSE * 0.25, PULSE * 7, PULSE * 13, PULSE * 19, PULSE * 25];
      // = [0.05, 1.4, 2.6, 3.8, 5.0]
      var SCENE_DURATION = 7;

      /* ---- cromo de ritmo: cada marca se enciende en su beat ---- */
      qa(".lqc-tick").forEach(function (tick, i) {
        tl.fromTo(
          tick,
          { opacity: 0.18 },
          { opacity: 1, duration: 0.1, ease: "power2.out" },
          BEATS[i]
        );
        tl.to(tick, { opacity: 0.45, duration: 0.32, ease: "power1.out" }, BEATS[i] + 0.1);
      });

      /* ================= Scene 1 (0.0–1.4) — corte duro ================= */
      tl.fromTo(
        "#lqc-b1",
        { opacity: 0 },
        { opacity: 1, duration: 0.001, ease: "none" },
        BEATS[0]
      );

      /* ================= Scene 2 (1.4–2.6) — colapso de interletraje ================= */
      tl.set("#lqc-b1", { opacity: 0 }, BEATS[1]); // corte duro: nada del beat anterior queda
      tl.fromTo(
        "#lqc-b2",
        { opacity: 0 },
        { opacity: 1, duration: 0.001, ease: "none" },
        BEATS[1]
      );
      // El interletraje inicial (0.42em sobre 158px = 66.4px por hueco) se
      // reparte como desplazamiento acumulado desde el centro de la línea: el
      // glifo i arranca en (i - centro) x 66.4 y viaja a 0. Índice puro, sin
      // medir el DOM y sin tocar el layout — sólo transform.
      (function () {
        var glyphs = document.querySelectorAll("#lqc-b2-line .lqc-glyph");
        var mid = (glyphs.length - 1) / 2;
        var SPREAD = 66.4;
        for (var i = 0; i < glyphs.length; i++) {
          tl.fromTo(
            glyphs[i],
            { x: (i - mid) * SPREAD },
            { x: 0, duration: 0.5, ease: "power4.out", immediateRender: false },
            BEATS[1]
          );
        }
      })();
      tl.fromTo(
        "#lqc-b2-line",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power4.out" },
        BEATS[1]
      );

      /* ========== Scene 3 (2.6–3.8) — deslizamiento enmascarado desde abajo ========== */
      tl.set("#lqc-b2", { opacity: 0 }, BEATS[2]);
      tl.fromTo(
        "#lqc-b3",
        { opacity: 0 },
        { opacity: 1, duration: 0.001, ease: "none" },
        BEATS[2]
      );
      tl.fromTo(
        "#lqc-b3-line",
        { yPercent: 108, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: 0.55, ease: "circ.out" },
        BEATS[2]
      );

      /* ================= Scene 4 (3.8–5.0) — estela de velocidad ================= */
      var blurNode = q("#lqc-streak-blur");
      var PEAK_BLUR = 26;
      var MOVE_DUR = 0.5;
      var blurProxy = { v: PEAK_BLUR };
      var writeBlur = function () {
        blurNode.setAttribute("stdDeviation", blurProxy.v + " 0");
      };
      writeBlur(); // semilla en el frame 0

      tl.set("#lqc-b3", { opacity: 0 }, BEATS[3]);
      tl.fromTo(
        "#lqc-b4",
        { opacity: 0 },
        { opacity: 1, duration: 0.001, ease: "none" },
        BEATS[3]
      );
      tl.fromTo(
        "#lqc-b4-line",
        { x: -560, opacity: 0 },
        { x: 0, opacity: 1, duration: MOVE_DUR, ease: "expo.out" },
        BEATS[3]
      );
      tl.to(
        blurProxy,
        { v: 0, duration: MOVE_DUR, ease: "expo.out", onUpdate: writeBlur },
        BEATS[3]
      );

      /* ===== Scene 5 (5.0–7.0) — center-outward-expansion a las cuatro esquinas ===== */
      tl.set("#lqc-b4", { opacity: 0 }, BEATS[4]);

      var EXPAND_DUR = 0.9;
      var STAGGER = 0.06;
      qa(".lqc-frag").forEach(function (el, i) {
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          {
            x: Number(el.dataset.targetX),
            y: Number(el.dataset.targetY),
            scale: 1,
            opacity: 1,
            duration: EXPAND_DUR,
            ease: "power3.out"
          },
          BEATS[4] + i * STAGGER
        );
      });

      /* la línea de cierre se revela DESPUÉS de la ráfaga, por palabra */
      tl.fromTo(
        "#lqc-close",
        { opacity: 0 },
        { opacity: 1, duration: 0.001, ease: "none" },
        BEATS[4] + 0.55
      );
      tl.fromTo(
        "#lqc-rule",
        { opacity: 0, scaleX: 0, transformOrigin: "50% 50%" },
        { opacity: 1, scaleX: 1, duration: 0.35, ease: "power3.out" },
        BEATS[4] + 0.55
      );
      qa(".lqc-w").forEach(function (w, i) {
        tl.fromTo(
          w,
          { opacity: 0, y: 26, filter: "blur(8px)" },
          {
            opacity: 1,
            y: 0,
            filter: "blur(0px)",
            duration: 0.4,
            ease: "power3.out"
          },
          BEATS[4] + 0.75 + i * 0.11
        );
      });

      /* asentamiento final: el cierre se sostiene quieto hasta el final */
      tl.fromTo(
        ".lqc-close-stack",
        { scale: 0.995 },
        { scale: 1, duration: 0.5, ease: "sine.out" },
        BEATS[4] + 1.45
      );
      window.__timelines = window.__timelines || {};
      window.__timelines["08-lo-que-cambia"] = tl;
    })();
  </script>
