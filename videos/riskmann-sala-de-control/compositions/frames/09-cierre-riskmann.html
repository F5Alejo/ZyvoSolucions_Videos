      /* ==========================================================
         Scene 1 (0.0-1.6s) - DESPEJE.
         The panels and pills still in frame disperse off the four
         edges (center-outward-expansion machinery run OUTWARD,

      /* the formation is on screen at t=0 - no CSS-hidden start */
      furn.forEach(function (el) {
        gsap.set(el, { x: 0, y: 0, opacity: 1 });

        var at = 0.06 + i * 0.06;
        tl.to(

            x: Number(el.dataset.outX),
            y: Number(el.dataset.outY),
            duration: 0.92,
            ease: "power3.out"
          },
          at
        );
        tl.to(el, { opacity: 0, duration: 0.36, ease: "power1.in" }, at + 0.46);
      });

      /* grid: dissolved outward-in - the outer field goes first,

      tl.fromTo(

      /* ==========================================================

         peak 0.40) over the closing rings.

      tl.fromTo(
        "#f09-mark",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.64, ease: "power3.out" },
        1.62
      );

      var segs = ["#f09-seg-0", "#f09-seg-1", "#f09-seg-2", "#f09-seg-3"];

        var p = document.querySelector(sel);
        var len = p.getTotalLength() * 1.02;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      var SEG_AT = [1.70, 2.08, 2.40, 2.66];
      var SEG_DUR = [0.50, 0.44, 0.38, 0.32];
      segs.forEach(function (sel, i) {
        tl.to(sel, { strokeDashoffset: 0, duration: SEG_DUR[i], ease: "power2.out" }, SEG_AT[i]);
      });

      /* draw -> fill: the solid white isotype seats as the last stroke lands */
      tl.fromTo(
        "#f09-mark-img",
        { opacity: 0 },
        { opacity: 1, duration: 0.42, ease: "power2.out" },
        2.96
      );
      tl.to("#f09-mark-draw", { opacity: 0, duration: 0.4, ease: "power1.out" }, 3.14);

      /* halo bloom - lands with the mark's settle, then a bounded breathe */
      tl.fromTo(

        { opacity: 0, scale: 0.84 },
        { opacity: 0.40, scale: 1, duration: 0.9, ease: "power2.out" },

      var haloEl = document.getElementById("f09-halo");
      var haloPhase = { p: 0 };
      var HALO_CYCLES = 1.5; /* whole half-cycles -> sin() lands exactly at 0 */

          ease: "none",

        },

      );

      /* closing rings - the atmosphere reserved for the closing frame */
      for (var r = 0; r < 3; r++) {
        tl.fromTo(
          "#f09-ring-" + r,
          { opacity: 0, scale: 0.88 },
          { opacity: 0.10 - r * 0.02, scale: 1, duration: 1.1, ease: "power2.out" },

        );

      /* ==========================================================
         Scene 3 (3.4-5.0s) - the lockup completes: the mark slides
         left and the wordmark CASCADES in letter by letter

      tl.to("#f09-halo", { x: -110, duration: 0.62, ease: "power3.out" }, 3.44);

      var F = 1 / 60;
      var LTR_Y = [78, 44, 46, 52, 74, 44, 46, 50];
      var LTR_D = [0.18, 0.13, 0.13, 0.14, 0.17, 0.13, 0.13, 0.14];
      var tCur = 3.66;
      for (var L = 0; L < 8; L++) {
        tl.set("#f09-l" + L, { opacity: 1, y: LTR_Y[L] }, tCur);
        tl.to("#f09-l" + L, { y: 0, duration: LTR_D[L], ease: "power4.out" }, tCur);

      tl.fromTo(
        "#f09-real",
        { opacity: 0, scale: 0.985 },
        { opacity: 1, scale: 1, duration: 0.58, ease: "power2.out" },
        5.02
      );
      tl.to("#f09-mark", { opacity: 0, duration: 0.5, ease: "power1.out" }, 5.06);
      tl.to("#f09-wordmark", { opacity: 0, duration: 0.5, ease: "power1.out" }, 5.06);

      tl.fromTo(
        "#f09-marker",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.55, ease: "power2.out" },
        5.50
      );

      tl.fromTo(
        "#f09-signline",
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.68, ease: "power2.out" },

      );

      /* ==========================================================
         Scene 5 (6.4-8.0s) - SOSTENIDA FINAL. Everything still;
         only a low-amplitude sine jitter on the lockup
         (sine-wave-loop, low end + settle-and-fade envelope).
         This is the one frame with a real exit: the halo closes

         ========================================================== */
      var lockEl = document.getElementById("f09-lockup");
      var idle = { p: 0 };
      var IDLE_CYCLES = 0.5; /* ends at sin(pi) = 0 -> rests exactly where it entered */
      tl.to(

          duration: 1.6,
          ease: "none",
          onUpdate: function () {

            var s = Math.sin(idle.p);
            lockEl.style.transform =
