  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ── Scene 1 (0.0–1.4s) — the HUD holds; the headline fills line by line.
         discrete-text-sequence: sparse {t,text} states, reverse-searched every frame. */
      var SEQ_1 = [
        { t: 0.00, text: "" },
        { t: 0.12, text: "Cuatro" },
        { t: 0.28, text: "Cuatro tableros" },
        { t: 0.44, text: "Cuatro tableros." }
      ];
      var SEQ_2 = [
        { t: 0.00, text: "" },
        { t: 0.72, text: "Un" },
        { t: 0.86, text: "Un solo" },
        { t: 1.02, text: "Un solo mando." }
      ];
      function stateAt(seq, time) {
        for (var i = seq.length - 1; i >= 0; i--) {
          if (time >= seq[i].t) return seq[i].text;
        }
        return "";
      }
      var hl1 = document.getElementById("cuatro-hl-1");
      var hl2 = document.getElementById("cuatro-hl-2");
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: 1.4,
          duration: 1.4,
          ease: "none",
          onUpdate: function () {
            hl1.textContent = stateAt(SEQ_1, driver.t);
            hl2.textContent = stateAt(SEQ_2, driver.t);
          }
        },
        0
      );
      tl.fromTo(
        "#cuatro-hl-rule",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.04
      );

      /* the empty 2x2 grid region is established, outlines barely visible */
      for (var s = 0; s < 4; s++) {
        tl.fromTo(
          "#cuatro-slot-" + s,
          { opacity: 0 },
          { opacity: 0.55, duration: 0.55, ease: "power2.out" },
          0.30 + s * 0.09
        );
      }

      /* ── Scene 2 (1.4–4.6s) — the four boards assemble in a staggered cascade.
         center-outward-expansion, partially-spread / short-path-into-slot form. */
      var PANEL_START = [1.40, 2.15, 2.90, 3.65];
      var PANEL_DUR = 0.8;
      var START_PROGRESS = 0.72; /* starts 28% of the way in toward the grid centre */
      for (var p = 0; p < 4; p++) {
        var el = document.getElementById("cuatro-panel-" + p);
        var tx = Number(el.dataset.targetX);
        var ty = Number(el.dataset.targetY);
        tl.fromTo(
          el,
          {
            xPercent: -50,
            yPercent: -50,
            x: tx * START_PROGRESS,
            y: ty * START_PROGRESS,
            scale: 0.94,
            opacity: 0
          },
          {
            x: tx,
            y: ty,
            scale: 1,
            opacity: 1,
            duration: PANEL_DUR,
            ease: "power3.out"
          },
          PANEL_START[p]
        );
        /* the slot outline hands its place over to the panel that fills it */
        tl.to(
          "#cuatro-slot-" + p,
          { opacity: 0.14, duration: 0.5, ease: "power2.out" },
          PANEL_START[p] + 0.25
        );
        /* label mask-wipe, one beat after the panel lands */
        tl.fromTo(
          "#cuatro-label-" + p,
          { clipPath: "inset(0 100% 0 0)" },
          { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.out" },
          PANEL_START[p] + 0.55
        );
      }

      /* ── Scene 3 (4.6–6.4s) — submodule pills stagger in by index ── */
      for (var q = 0; q < 4; q++) {
        var pills = document.querySelectorAll("#cuatro-panel-" + q + " .cuatro-pill");
        for (var r = 0; r < pills.length; r++) {
          tl.fromTo(
            pills[r],
            { opacity: 0, y: 14, scale: 0.92 },
            { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
            4.60 + q * 0.16 + r * 0.07
          );
        }
      }

      /* ambient-glow-bloom — Form B: one traveling lavender sweep, top-left to bottom-right */
      tl.fromTo(
        "#cuatro-sweep",
        { x: -460, rotation: 18, opacity: 0 },
        { x: 1900, rotation: 18, opacity: 0.22, duration: 1.3, ease: "none" },
        5.0
      );
      tl.to("#cuatro-sweep", { opacity: 0, duration: 0.4, ease: "power1.in" }, 6.0);

      /* ── Scene 4 (6.4–8.0s) — Seguridad vial comes to the front.
         ambient-glow-bloom Form A (bloom-and-hold) + depth-of-field-blur focal pull. */
      tl.fromTo(
        "#cuatro-glow-core",
        { opacity: 0, scale: 0.86 },
        { opacity: 0.34, scale: 1, duration: 0.85, ease: "power2.out" },
        6.4
      );
      tl.to("#cuatro-panel-3", { scale: 1.05, duration: 0.85, ease: "power2.out" }, 6.4);

      var ctxLayers = document.querySelectorAll(".cuatro-ctx");
      for (var c = 0; c < ctxLayers.length; c++) {
        var depth = Number(ctxLayers[c].dataset.depth) || 1;
        tl.to(
          ctxLayers[c],
          {
            "--dof": 4 * depth + "px",
            opacity: 0.55,
            duration: 0.9,
            ease: "power2.inOut"
          },
          6.4
        );
      }
      /* holds to 8.0s — no exit tween (this is not the final frame) */

      window.__timelines["04-cuatro-tableros"] = tl;
    })();
  </script>
