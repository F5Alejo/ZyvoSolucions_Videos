  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ══ Scene 1 (0.0–1.5s) ═══════════════════════════════════
         The captured phone slides in from the right edge and SETTLES on a
         nudge-curve: power3.in ramp (10% dist / 21% time) → linear burst
         (65% / 18%) → power4.out tail (25% / 61%). Total travel 520px. */
      gsap.set("#cdp-device", { x: 520 });
      tl.to("#cdp-device", { x: 468, duration: 0.25, ease: "power3.in" }, 0.00);
      tl.to("#cdp-device", { x: 130, duration: 0.22, ease: "none" }, 0.25);
      tl.to("#cdp-device", { x: 0, duration: 0.73, ease: "power4.out" }, 0.47);

      /* the surface panel resolves behind it as one beat */
      tl.fromTo(
        "#cdp-panel",
        { opacity: 0, scaleY: 0.88 },
        { opacity: 1, scaleY: 1, duration: 0.85, ease: "power3.out" },
        0.05
      );

      /* ══ Scene 2 (1.5–3.2s) ═══════════════════════════════════
         Headline revealed WORD BY WORD — discrete-text-sequence: sparse
         {t,text} states per line, reverse-searched on every frame. */
      tl.fromTo("#cdp-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.42, ease: "power3.out" }, 1.35);
      tl.fromTo("#cdp-eyebrow", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 1.45);

      var SEQ_1 = [
        { t: 0.00, text: "" },
        { t: 1.58, text: "La" },
        { t: 1.74, text: "La gente" },
        { t: 1.94, text: "La gente entra" }
      ];
      var SEQ_2 = [
        { t: 0.00, text: "" },
        { t: 2.18, text: "con" },
        { t: 2.33, text: "con su" },
        { t: 2.52, text: "con su cara," }
      ];
      var SEQ_3 = [
        { t: 0.00, text: "" },
        { t: 2.76, text: "no" },
        { t: 2.89, text: "no con" },
        { t: 3.02, text: "no con una" },
        { t: 3.16, text: "no con una firma." }
      ];

      function textAt(seq, time) {
        for (var i = seq.length - 1; i >= 0; i--) {
          if (time >= seq[i].t) return seq[i].text;
        }
        return "";
      }

      var hl1 = document.getElementById("cdp-hl-1");
      var hl2 = document.getElementById("cdp-hl-2");
      var hl3 = document.getElementById("cdp-hl-3");
      var scriptDriver = { t: 0 };
      tl.to(
        scriptDriver,
        {
          t: 7,
          duration: 7,
          ease: "none",
          onUpdate: function () {
            hl1.textContent = textAt(SEQ_1, scriptDriver.t);
            hl2.textContent = textAt(SEQ_2, scriptDriver.t);
            hl3.textContent = textAt(SEQ_3, scriptDriver.t);
          }
        },
        0
      );

      /* ══ Scene 3 (3.2–5.0s) ═══════════════════════════════════
         ambient-glow-bloom, Form B (traveling sweep): one finite pass of a
         soft band down the phone screen, off-surface at both ends. */
      tl.fromTo(
        "#cdp-scan-band",
        { y: -140, opacity: 0 },
        { y: 300, opacity: 0.42, duration: 0.62, ease: "none" },
        3.25
      );
      tl.to("#cdp-scan-band", { y: 500, opacity: 0, duration: 0.42, ease: "power1.in" }, 3.87);

      /* the one red focus halo of the shot — blooms on the QR (Form A) */
      tl.fromTo(
        "#cdp-qr-glow",
        { opacity: 0, scale: 0.84 },
        { opacity: 0.30, scale: 1, duration: 0.72, ease: "power2.out" },
        4.02
      );

      /* ai-tracking-box — locks on, then the box is derived from the target
         every frame by ONE ease:"none" driver (never tweened on its own). */
      tl.fromTo(
        "#cdp-track-box",
        { opacity: 0, scale: 0.68 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.9)" },
        4.18
      );

      var box = document.getElementById("cdp-track-box");
      var TARGET_X = 1472; /* centre of the QR icon on the card icon rail */
      var TARGET_Y = 692;
      var SIZE_W = 150, SIZE_H = 110, SIZE_VAR = 8, SIZE_FREQ_MULT = 2.3;
      var tracking = { p: 0 };
      tl.to(
        tracking,
        {
          p: Math.PI * 2,
          duration: 1.6,
          ease: "none",
          onUpdate: function () {
            /* target first (the QR is fixed on the captured card, so it only
               micro-settles), box derived from it in the same pass */
            var mx = TARGET_X + Math.cos(tracking.p) * 2;
            var my = TARGET_Y + Math.sin(tracking.p) * 2;
            var w = SIZE_W + Math.sin(tracking.p * SIZE_FREQ_MULT) * SIZE_VAR;
            var h = SIZE_H + Math.sin(tracking.p * SIZE_FREQ_MULT + Math.PI / 2) * SIZE_VAR;
            box.style.width = w + "px";
            box.style.height = h + "px";
            box.style.left = (mx - w / 2) + "px";
            box.style.top = (my - h / 2) + "px";
          }
        },
        4.60
      );

      /* ══ Scene 4 (5.0–6.2s) ═══════════════════════════════════
         center-outward-expansion with the DEVICE as the shared origin: the
         three submodule pills start clustered on the phone and radiate out
         to the left column, each tied back by a lavender hairline
         (svg-path-draw, measured getTotalLength). */
      var pills = document.querySelectorAll(".cdp-pill");
      for (var i = 0; i < pills.length; i++) {
        tl.fromTo(
          pills[i],
          { xPercent: -50, yPercent: -50, x: 510, y: -60, scale: 0.55, opacity: 0 },
          {
            x: Number(pills[i].dataset.targetX),
            y: Number(pills[i].dataset.targetY),
            scale: 1,
            opacity: 1,
            duration: 0.85,
            ease: "power3.out"
          },
          5.00 + i * 0.17
        );
      }

      var links = document.querySelectorAll(".cdp-link");
      for (var L = 0; L < links.length; L++) {
        var len = links[L].getTotalLength();
        links[L].style.strokeDasharray = String(len);
        links[L].style.strokeDashoffset = String(len);
        tl.to(links[L], { strokeDashoffset: 0, duration: 0.60, ease: "power2.out" }, 5.22 + L * 0.17);
        tl.to("#cdp-dot-" + L, { opacity: 0.9, duration: 0.26, ease: "power1.out" }, 5.70 + L * 0.17);
      }

      /* ══ Scene 5 (6.2–7.0s) ═══════════════════════════════════
         Held. Everything still except the internals of the QR-reader mark
         (svg-icon-enrichment: dash flow + centred pulse, both written via
         the SVG transform / stroke attributes, never CSS transform-origin). */
      var markScan = document.getElementById("cdp-mark-scan");
      var markDot = document.getElementById("cdp-mark-dot");

      var flow = { offset: 0 };
      tl.to(
        flow,
        {
          offset: -39, /* 3 x the 13px dash period → no phase jump at the end */
          duration: 0.80,
          ease: "none",
          onUpdate: function () {
            markScan.style.strokeDashoffset = String(flow.offset);
          }
        },
        6.20
      );

      var travel = { y: 13 };
      tl.to(
        travel,
        {
          y: 35,
          duration: 0.80,
          ease: "none",
          onUpdate: function () {
            markScan.setAttribute("y1", String(travel.y));
            markScan.setAttribute("y2", String(travel.y));
          }
        },
        6.20
      );

      var pulse = { p: 0 };
      tl.to(
        pulse,
        {
          p: Math.PI * 2,
          duration: 0.80,
          ease: "none",
          onUpdate: function () {
            var s = 1 + Math.sin(pulse.p) * 0.16;
            markDot.setAttribute("transform", "translate(24 24) scale(" + s + ") translate(-24 -24)");
          }
        },
        6.20
      );
      /* holds to 7.0s — no exit tween (this is not the final frame) */

      window.__timelines["05-control-de-personal"] = tl;
    })();
  </script>
</template>
