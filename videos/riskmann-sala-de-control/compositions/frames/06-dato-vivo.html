<template>
  <style>
    /* Montserrat es la familia normativa de frame.md. El @font-face que apunta a
       assets/fonts/montserrat-latin*.woff2 lo inyecta el orquestador en este
       archivo despues del build; aqui solo se nombra la familia. */

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      color: #F2F7FF;
      font-family: "Montserrat", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .dv-layer {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
    }

    /* -- ground ------------------------------------------------ */
    .dv-ground { background: #051427; }
    /* campo radial: el unico elemento que se mueve en la Escena 1 -- el
       "empuje lento de camara por debajo". Los tres monitores estan clavados
       a coordenadas del host, asi que la camara no puede tocarlos antes
       de 3.62s; el empuje vive por debajo, en la atmosfera. */
    .dv-field {
      position: absolute;
      left: 0; top: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 50% 58%;
      background:
        radial-gradient(1220px 800px at 960px 470px, rgba(15, 57, 107, 0.62) 0%, rgba(5, 20, 39, 0) 76%),
        radial-gradient(760px 520px at 960px 900px, rgba(230, 66, 60, 0.10) 0%, rgba(5, 20, 39, 0) 78%);

    /* -- HUD estatico (identico a 03/04/05/07/08) -------------- */

      background-image:
        linear-gradient(to right, rgba(142, 143, 196, 0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(142, 143, 196, 0.14) 1px, transparent 1px);
      background-size: 60px 60px;
      background-position: 0px 0px;
    }
    .dv-bracket {
      position: absolute;
      width: 128px;
      height: 128px;
      opacity: 0.6;
    }
    .dv-bracket::before,
    .dv-bracket::after {
      content: "";
      position: absolute;
      background: #8E8FC4;
    }
    .dv-bracket::before { width: 128px; height: 2px; }
    .dv-bracket::after  { width: 2px; height: 128px; }
    .dv-br-tl { top: 56px;  left: 56px;  }
    .dv-br-tl::before { top: 0; left: 0; }
    .dv-br-tl::after  { top: 0; left: 0; }
    .dv-br-tr { top: 56px;  right: 56px; }
    .dv-br-tr::before { top: 0; right: 0; }
    .dv-br-tr::after  { top: 0; right: 0; }
    .dv-br-bl { bottom: 56px; left: 56px; }
    .dv-br-bl::before { bottom: 0; left: 0; }
    .dv-br-bl::after  { bottom: 0; left: 0; }
    .dv-br-br { bottom: 56px; right: 56px; }
    .dv-br-br::before { bottom: 0; right: 0; }
    .dv-br-br::after  { bottom: 0; right: 0; }

    /* -- camara (solo entra en juego a partir de 3.72s) -------- */
    .dv-camera {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    /* -- superficies de pantalla ------------------------------- */
    .dv-panel {

      box-sizing: border-box;
      border: 1.5px solid rgba(142, 143, 196, 0.28);
      background: #0C2B53;
      overflow: hidden;
    }
    /* "pantalla en reposo": SIEMPRE opaca, para que al cerrarse la ventana
       de un video el monitor nunca muestre un hueco. */
    .dv-rest {
      position: absolute;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(142, 143, 196, 0.055) 0px,
          rgba(142, 143, 196, 0.055) 1px,
          rgba(142, 143, 196, 0) 1px,
          rgba(142, 143, 196, 0) 4px),
        linear-gradient(158deg, #103C71 0%, #0C2B53 48%, #071C36 100%);
    }

    /* monitor central -- pantalla interior exacta 528,192,864x472 */
    .dv-center {

      top: 176px;
      width: 896px;
      height: 504px;

    .dv-center-panel {

    .dv-center-chrome {

    /* -- monitores laterales ----------------------------------- */
    .dv-side {

    .dv-housing-tick {

    .dv-housing-r .dv-housing-tick { left: auto; right: 32px; }

    /* pantallas laterales -- interiores exactos 84,312 y 1480,312 (356x212) */
    .dv-side-screen {
      position: absolute;
      top: 300px;
      width: 380px;

    }
    .dv-screen-l { left: 72px; }

    /* -- contador (counting-dynamic-scale) --------------------- */
    .dv-counter-wrap {
      position: absolute;

    .dv-counter {

    .dv-suffix {

    /* -- linea de impacto -------------------------------------- */
    .dv-line-wrap {

    }
    .dv-line {

    .dv-w {

    }
    .dv-w.dv-accent { color: #E6423C; }
  </style>

  <div
    id="root"
    data-composition-id="06-dato-vivo"
    data-start="0"
    data-duration="8.4"
    data-width="1920"
    data-height="1080"
  >
    <!-- capa 0 - fondo a sangre (clip, nunca en #root) -->
    <div class="clip dv-layer dv-ground" data-start="0" data-duration="8.4" data-track-index="0">
      <div class="dv-field" id="dv-field"></div>
    </div>

    <!-- capa 1 - HUD estatico: reticula 60x60 + cuatro marcas de esquina -->
    <div class="clip dv-layer" data-start="0" data-duration="8.4" data-track-index="1">
      <div class="dv-layer dv-hud-grid"></div>
      <div class="dv-bracket dv-br-tl"></div>
      <div class="dv-bracket dv-br-tr"></div>
      <div class="dv-bracket dv-br-bl"></div>
      <div class="dv-bracket dv-br-br"></div>
    </div>

    <!-- capa 2 - todo lo demas viaja dentro de la camara -->
    <div class="clip dv-layer" data-start="0" data-duration="8.4" data-track-index="2">
      <div class="dv-camera" id="dv-camera">

        <!-- monitores laterales (split-tilt-cards + depth-of-field-blur) -->
        <div class="dv-side" id="dv-side-l">
          <div class="dv-housing dv-housing-l" id="dv-housing-l">
            <div class="dv-housing-tick">Estadisticas</div>

          <div class="dv-panel dv-side-screen dv-screen-l" id="dv-screen-l">

        <div class="dv-side" id="dv-side-r">
          <div class="dv-housing dv-housing-r" id="dv-housing-r">
            <div class="dv-housing-tick">Registros</div>
          </div>
          <div class="dv-panel dv-side-screen dv-screen-r" id="dv-screen-r">
            <div class="dv-rest dv-side-rest"></div>
          </div>
        </div>

        <!-- monitor central: pantalla interior clavada en 528,192,864x472 -->
        <div class="dv-center" id="dv-center">
          <div class="dv-panel dv-center-panel">
            <div class="dv-rest dv-center-rest"></div>
          </div>
          <div class="dv-cut" id="dv-cut"></div>
          <div class="dv-center-chrome">
            <span class="dv-dot"></span>
            <span class="dv-tick">Senal en vivo</span>
            <span class="dv-tick dv-tick-r">Plataforma RiskMann</span>
          </div>
        </div>

        <!-- la cifra que recibe el peso del video -->
        <div class="dv-counter-wrap" id="dv-counter-wrap">
          <span class="dv-counter" id="dv-counter">0</span><span class="dv-suffix" id="dv-suffix">%</span>
        </div>
        <div class="dv-counter-label" id="dv-counter-label">Trazabilidad del registro</div>

        <!-- linea de cierre, palabra por palabra -->
        <div class="dv-line-wrap">
          <div class="dv-line">
            <span class="dv-w" data-w="a0"></span><span class="dv-w" data-w="a1"></span><span class="dv-w" data-w="a2"></span><span class="dv-w" data-w="a3"></span><span class="dv-w" data-w="a4"></span>
          </div>
          <div class="dv-line">
            <span class="dv-w" data-w="b0"></span><span class="dv-w dv-accent" data-w="b1"></span><span class="dv-w dv-accent" data-w="b2"></span><span class="dv-w dv-accent" data-w="b3"></span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var TOTAL = 8.4;

      /* =========================================================
         Escena 1 (0.0-1.8s) - la pantalla central entra y
         graficas.mp4 (montado en el host sobre 528,192,864x472)
         arranca dentro de ella en 0.42s. El marco tiene que estar
         QUIETO desde 0.42, asi que la entrada aterriza en 0.40.
         ========================================================= */
      tl.fromTo(
        "#dv-center",
        { opacity: 0, scaleY: 0.90, scaleX: 0.985 },
        { opacity: 1, scaleY: 1, scaleX: 1, duration: 0.40, ease: "power3.out" },
        0.00
      );

      /* multi-phase-camera, fase unica de "empuje por debajo": mientras los
         clips estan abiertos el empuje corre en la atmosfera (no puede tocar
         los marcos clavados); la camara real toma el relevo en 3.72s. */
      tl.fromTo(
        "#dv-field",
        { scale: 1.0, y: 0 },
        { scale: 1.10, y: -26, duration: 3.60, ease: "power1.inOut" },
        0.00
      );

      /* =========================================================
         Escena 2 (1.8-3.6s) - split-tilt-cards: las dos laterales se
         encienden con un beat de diferencia, inclinadas hacia el
         centro (izquierda +TILT, derecha -TILT), pivotando desde un
         sobregiro. Las pantallas quedan a plomo y en reposo ANTES de
         que abran sus clips (1.98 y 2.16). Sin flotacion continua.
         ========================================================= */
      var TILT = 11;
      var OVERSHOOT = 9;

      tl.fromTo(
        "#dv-housing-l",
        { x: -46, rotateY: TILT + OVERSHOOT, opacity: 0.22 },
        { x: 0, rotateY: TILT, opacity: 1, duration: 0.62, ease: "power3.out" },
        1.34
      );
      tl.fromTo(
        "#dv-housing-r",
        { x: 46, rotateY: -TILT - OVERSHOOT, opacity: 0.22 },
        { x: 0, rotateY: -TILT, opacity: 1, duration: 0.62, ease: "power3.out" },
        1.50
      );
      /* el encendido de la superficie: nunca baja de 1 mientras el clip vive */
      tl.fromTo("#dv-screen-l", { opacity: 0.22 }, { opacity: 1, duration: 0.42, ease: "power2.out" }, 1.50);
      tl.fromTo("#dv-screen-r", { opacity: 0.22 }, { opacity: 1, duration: 0.42, ease: "power2.out" }, 1.66);

      /* depth-of-field-blur, mecanica 1 (tiron focal): los chasis laterales
         se desenfocan y se atenuan; la central se queda nitida y manda.
         Solo el chasis - la pantalla sigue limpia bajo su video. */
      tl.to("#dv-housing-l", { "--dof": "3px", opacity: 0.82, duration: 0.80, ease: "power2.inOut" }, 2.30);
      tl.to("#dv-housing-r", { "--dof": "3px", opacity: 0.82, duration: 0.80, ease: "power2.inOut" }, 2.36);

      /* =========================================================
         Escena 3 (3.6-5.4s) - TRANSFERENCIA DE PESO (mov. firma).
         Las laterales se atenuan un beat antes; la central se desliza
         y encoge hacia la izquierda entregando el hueco a la cifra,
         que entra en el mismo anclaje. Un solo suceso.
         ========================================================= */
      /* las laterales, ya cerrados sus clips (3.52), se van al fondo */
      tl.to("#dv-side-l", { "--dof": "12px", opacity: 0.16, x: -44, duration: 0.80, ease: "power2.inOut" }, 3.54);
      tl.to("#dv-side-r", { "--dof": "12px", opacity: 0.16, x: 44, duration: 0.80, ease: "power2.inOut" }, 3.58);

      /* corte de senal en la central: destello corto al cerrar la ventana */
      tl.fromTo("#dv-cut", { opacity: 0, scaleY: 1 }, { opacity: 0.9, scaleY: 0.04, duration: 0.18, ease: "power2.in" }, 3.58);
      tl.to("#dv-cut", { opacity: 0, duration: 0.14, ease: "power1.out", overwrite: "auto" }, 3.77);

      /* la central cede el cuadro: se desliza a la esquina superior
         izquierda y encoge a fuente de consulta */
      tl.to(
        "#dv-center",
        { x: -560, y: -210, scale: 0.34, opacity: 0.55, duration: 0.90, ease: "power3.inOut" },
        3.66
      );

      /* multi-phase-camera - fase unica de empuje, ya con los clips
         cerrados: nada clavado se mueve antes de tiempo. */
      var camera = document.getElementById("dv-camera");
      var phase = { scale: 1.0 };
      tl.to(phase, { scale: 1.035, duration: 2.40, ease: "power2.out" }, 3.72);

      var drift = { p: 0 };
      tl.to(
        drift,
        {
          p: Math.PI * 2,
          duration: TOTAL - 3.72,
          ease: "none",
          onUpdate: function () {
            var dx = Math.sin(drift.p) * 5;
            var dy = Math.sin(drift.p * 1.3) * 3;
            camera.style.transform = "scale(" + phase.scale + ") translate(" + dx + "px, " + dy + "px)";
          }
        },
        3.72
      );

      /* counting-dynamic-scale - el valor sube mientras la escala crece
         hasta su tamano final; el sufijo llega DESPUES del conteo. */
      var COUNT_AT = 3.88;
      var COUNT_DUR = 1.28;
      var START_SIZE = 130, END_SIZE = 250;
      var counterEl = document.getElementById("dv-counter");
      var countState = { value: 0 };

      tl.fromTo("#dv-counter-wrap", { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power2.out" }, COUNT_AT - 0.06);

      tl.to(
        countState,
        {
          value: 100,
          duration: COUNT_DUR,
          ease: "power3.out",
          onUpdate: function () {
            counterEl.textContent = String(Math.round(countState.value));
          }
        },
        COUNT_AT
      );
      tl.fromTo(
        "#dv-counter",
        { scale: START_SIZE / END_SIZE },
        { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
        COUNT_AT
      );
      tl.fromTo(
        "#dv-suffix",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.40, ease: "back.out(1.6)" },
        COUNT_AT + COUNT_DUR
      );
      /* la etiqueta chrome llega antes del pico del conteo */
      tl.fromTo(
        "#dv-counter-label",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        COUNT_AT + 0.42
      );

      /* =========================================================
         Escena 4 (5.4-8.0s) - la linea entra PALABRA POR PALABRA
         (discrete-text-sequence: estados sueltos {t,text} por palabra,
         busqueda inversa cada frame, saltos instantaneos) y el
         resplandor de palabra clave (asr-keyword-glow) aterriza sobre
         "se esta armando". Sostiene quieto hasta el final.
         ========================================================= */
      var WORDS = [
        { k: "a0", t: 5.45, text: "El" },
        { k: "a1", t: 5.60, text: "informe" },
        { k: "a2", t: 5.80, text: "no" },
        { k: "a3", t: 5.93, text: "se" },
        { k: "a4", t: 6.06, text: "arma." },
        { k: "b0", t: 6.40, text: "Ya" },
        { k: "b1", t: 6.60, text: "se" },
        { k: "b2", t: 6.78, text: "está" },
        { k: "b3", t: 6.98, text: "armando." }
      ];
      var wordEls = {};
      var allWords = document.querySelectorAll(".dv-w");
      for (var i = 0; i < allWords.length; i++) {
        wordEls[allWords[i].dataset.w] = allWords[i];
      }

      var textDriver = { t: 0 };
      tl.to(
        textDriver,
        {
          t: TOTAL,
          duration: TOTAL,
          ease: "none",
          onUpdate: function () {
            for (var w = WORDS.length - 1; w >= 0; w--) {
              var el = wordEls[WORDS[w].k];
              if (!el) continue;
              el.textContent = textDriver.t >= WORDS[w].t ? WORDS[w].text : "";
            }
          }
        },
        0
      );

      /* asr-keyword-glow - un solo driver lineal para todas las palabras
         acentuadas; envolvente ataque / sostenido / caida a nivel de reposo.
         Ventanas monotonas y sin solape; la ultima palabra sostiene mas. */
      var TIMINGS = {
        b1: { start: 6.62, end: 6.76 },
        b2: { start: 6.80, end: 6.96 },
        b3: { start: 7.00, end: 7.62 }
      };
      var ATTACK_DUR = 0.12, RELEASE = 0.34, REST_LEVEL = 0.26;
      var MAX_BLUR = 34, MAX_SCALE_BOOST = 0.10;

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }

      var accentEls = document.querySelectorAll(".dv-accent");
      var glowDriver = { t: 0 };
      tl.to(
        glowDriver,
        {
          t: TOTAL,
          duration: TOTAL,
          ease: "none",
          onUpdate: function () {
            for (var g = 0; g < accentEls.length; g++) {
              var el = accentEls[g];
              var timing = TIMINGS[el.dataset.w];
              if (!timing) continue;
              var env = envelope(glowDriver.t, timing.start, timing.end);
              el.style.textShadow = "0 0 " + (MAX_BLUR * env) + "px rgba(230, 66, 60, " + (0.9 * env) + ")";
              el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env) + ")";
            }
          }
        },
        0
      );

      /* sostiene quieto hasta 8.4 - sin tween de salida (no es el ultimo plano) */

      window.__timelines["06-dato-vivo"] = tl;
    })();
  </script>
</template>
