  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var SPACING = 1180;

      var world = document.getElementById("f07-world");
      var farPlate = document.getElementById("f07-far");
      var midPlate = document.getElementById("f07-mid");
      var blurNode = document.getElementById("f07-streak-blur");

      /* ── viewport-change, PAN mode ────────────────────────────
         Single camera state; ONE writer composes the world transform.
         Single-wrapper counter-translate: T = -offset x S.
         The two background plates counter-move inside the world to
         yield 0.35x / 0.72x parallax against the station plate.      */
      var cam = { offset: 0, scale: 1 };
      var blurProxy = { v: 0 };

      function applyCamera() {
        var tx = -cam.offset * cam.scale;
        world.style.transform = "translate(" + tx + "px, 0px) scale(" + cam.scale + ")";
        farPlate.style.transform = "translateX(" + (cam.offset * 0.65) + "px)";
        midPlate.style.transform = "translateX(" + (cam.offset * 0.28) + "px)";
      }
      function writeBlur() {
        blurNode.setAttribute("stdDeviation", blurProxy.v + " 0");
      }
      applyCamera(); // seed frame 0 — camera opens on station 01
      writeBlur();   // seed at 0: the streak lives mid-leg, not at t=0

      /* pan-to-target leg: ease-in-out, blur envelope split at the
         velocity peak (motion-blur-streak, camera-travel carve-out) */
      function panTo(index, at, dur, peak) {
        tl.to(
          cam,
          {
            offset: index * SPACING,
            duration: dur,
            ease: "power2.inOut",
            onUpdate: applyCamera
          },
          at
        );
        if (peak) {
          tl.to(
            blurProxy,
            { v: peak, duration: dur / 2, ease: "power2.in", onUpdate: writeBlur },
            at
          );
          tl.to(
            blurProxy,
            { v: 0, duration: dur / 2, ease: "power2.out", onUpdate: writeBlur },
            at + dur / 2
          );
        }
      }

      /* spring-pop callout, transform-origin pinned at the triangle tip */
      function popCallout(sel, at, overshoot) {
        tl.fromTo(
          sel,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.46, ease: "back.out(" + overshoot + ")" },
          at
        );
      }

      /* ── Scene 1 (0.0–1.6s) — camera opens framed on station 01.
         The icon is on screen from frame 0; its callout springs a
         beat after the station has settled. ─────────────────────── */
      popCallout("#f07-co-0", 0.42, 1.5);
      tl.fromTo(
        "#f07-co-0 .f07-eyebrow",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
        0.62
      );

      /* ── Scene 2 (1.6–3.4s) — one continuous lateral move that
         decelerates onto VEHÍCULOS, then onto INSPECCIONES. Each
         callout reveals only once its station is centered. ──────── */
      panTo(1, 1.55, 0.70, 0);
      popCallout("#f07-co-1", 2.22, 1.7);
      tl.fromTo(
        "#f07-co-1 .f07-eyebrow",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" },
        2.38
      );

      panTo(2, 2.55, 0.70, 0);
      popCallout("#f07-co-2", 3.22, 1.7);
      tl.fromTo(
        "#f07-co-2 .f07-eyebrow",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" },
        3.36
      );

      /* ── Scene 3 (3.4–5.4s) — the traverse accelerates through
         MANTENIMIENTOS · FORMATOS · INFOGRAFÍAS, each leg carrying a
         lateral motion-blur streak. One-word callouts, faster pops. */
      panTo(3, 3.45, 0.50, 14);
      popCallout("#f07-co-3", 3.90, 2.0);

      panTo(4, 4.08, 0.45, 15);
      popCallout("#f07-co-4", 4.49, 2.0);

      panTo(5, 4.70, 0.45, 16);
      popCallout("#f07-co-5", 5.11, 2.0);

      /* ── Scene 4 (5.4–8.0s) — the whip sweep brakes hard onto the
         terminal station. Position: ramp-in → linear burst → power4
         tail. Blur: 0→PEAK on the ramp, held through the burst,
         PEAK→0 across the tail. Camera then goes static. ────────── */
      var OFF_5 = 5 * SPACING;
      var OFF_6 = 6 * SPACING;
      var WHIP_AT = 5.35;

      tl.to(
        cam,
        { offset: OFF_5 + SPACING * 0.10, duration: 0.12, ease: "power3.in", onUpdate: applyCamera },
        WHIP_AT
      );
      tl.to(
        cam,
        { offset: OFF_5 + SPACING * 0.75, duration: 0.10, ease: "none", onUpdate: applyCamera },
        WHIP_AT + 0.12
      );
      tl.to(
        cam,
        { offset: OFF_6, duration: 0.45, ease: "power4.out", onUpdate: applyCamera },
        WHIP_AT + 0.22
      );

      tl.to(
        blurProxy,
        { v: 18, duration: 0.12, ease: "power3.in", onUpdate: writeBlur },
        WHIP_AT
      );
      /* blur rests at PEAK through the linear burst */
      tl.to(
        blurProxy,
        { v: 0, duration: 0.45, ease: "power4.out", onUpdate: writeBlur },
        WHIP_AT + 0.22
      );

      /* a small settle push so the terminal station holds ~45% of frame */
      tl.to(
        cam,
        { scale: 1.05, duration: 0.95, ease: "power3.out", onUpdate: applyCamera },
        WHIP_AT + 0.22
      );

      /* halo ambiental — the one red focus glow of the scene */
      tl.fromTo(
