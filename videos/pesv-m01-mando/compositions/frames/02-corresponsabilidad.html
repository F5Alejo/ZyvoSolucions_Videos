      /* ---- 1.5-4.0s · «No manejar / no significa ser / un actor pasivo.» ---
         VO 02 starts at 1.5s; first sentence ends ~4.0s. Mask + yPercent. */

      tl.fromTo("#f02-h2", { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, 2.2);
      tl.fromTo("#f02-h3", { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, 3.05);

      /* ---- 4.1-8.8s · «La seguridad también viaja en el asiento del pasajero.» */
      tl.fromTo("#f02-sep", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 4.05);
      tl.fromTo("#f02-s1", { yPercent: 115 }, { yPercent: 0, duration: 0.65, ease: "power3.out" }, 4.2);

      var corners = [0, 1, 2, 3].map(function (k) { return document.getElementById("f02-c" + k); });
      function cornerXY(p, k) {
        var l = p[0] - p[2] / 2, t = p[1] - p[3] / 2, r = p[0] + p[2] / 2, b = p[1] + p[3] / 2;
        var L0 = LOCK[0] - LOCK[2] / 2, T0 = LOCK[1] - LOCK[3] / 2, R0 = LOCK[0] + LOCK[2] / 2, B0 = LOCK[1] + LOCK[3] / 2;
        if (k === 0) return { x: l - L0, y: t - T0 };
        if (k === 1) return { x: r - R0, y: t - T0 };
        if (k === 2) return { x: l - L0, y: b - B0 };
        return { x: r - R0, y: b - B0 };
      }
      function xhXY(p) { return { x: p[0] - LOCK[0], y: p[1] - LOCK[1] }; }
      var POSES = [
        [712, 214, 372, 268],   // windscreen / wiper
        [236, 322, 214, 262],   // side window

        [548, 292, 408, 380],   // close: too wide
        [524, 306.5, 330, 347], // lock + 12px, then tightens
        LOCK

      var MOVES = [ // [from pose, to pose, at, dur, ease]
        [0, 1, 1.95, 0.55, "power3.inOut"],
        [1, 2, 3.05, 0.55, "power3.inOut"],
        [2, 3, 4.35, 0.6, "power3.inOut"],
        [3, 4, 6.35, 0.5, "power3.inOut"],
        [4, 5, 6.9, 0.35, "power3.out"]
      ];
      for (var k = 0; k < 4; k++) {
        var p0 = cornerXY(POSES[0], k);
        tl.fromTo(corners[k], { x: p0.x, y: p0.y, opacity: 0 }, { x: p0.x, y: p0.y, opacity: 0.8, duration: 0.25, ease: "power2.out" }, 1.2);
        for (var m = 0; m < MOVES.length; m++) {
          var a = cornerXY(POSES[MOVES[m][0]], k), b2 = cornerXY(POSES[MOVES[m][1]], k);
