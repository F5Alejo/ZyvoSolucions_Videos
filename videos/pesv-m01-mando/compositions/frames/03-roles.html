      <div class="f03-rule"></div>
      <div class="f03-label" id="f03-label" data-text="CAPACITACIÓN PESV · MÓDULO 01 · ACTOR VIAL" aria-label="CAPACITACIÓN PESV · MÓDULO 01 · ACTOR VIAL"></div>
      <div class="f03-section">03 · CADA ROL</div>
    </div>

    <!-- 9 · the official RiskMann bug — TOPMOST, static, nothing over it -->
    <div id="f03-lock-layer" class="clip f03-layer" data-start="0" data-duration="20" data-track-index="9">
      <div class="f03-lock">
        <img class="f03-logo" src="assets/marca/riskmann_logo_blanco.png" alt="RiskMann by SOFU" />
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---- static chrome: telemetry label rebuilt exactly as 01 leaves it
         (per-char inline-blocks, nbsp for spaces, rotateX 0, opacity 1) ---- */
      var labelEl = document.getElementById("f03-label");
      var TXT = labelEl.getAttribute("data-text");
      for (var c = 0; c < TXT.length; c++) {
        var ch = TXT.charAt(c);
        var outer = document.createElement("span");
        outer.className = "f03-ch";
        outer.setAttribute("data-layout-allow-overlap", "");
        outer.style.transform = "rotateX(0deg)";
        outer.textContent = ch === " " ? "\u00A0" : ch;
        labelEl.appendChild(outer);
      }

      /* VO (03.wav placed at 1.5s; measured with silencedetect + formant
         tracking, times in FRAME seconds):
           «Esto aplica a todos los colaboradores,» 1.54-3.53 («todos» ~2.3)
           «sin importar su cargo.»                 3.71-4.87
           «Y a cada rol:»                          5.08-5.80
           «peatón,»        6.12   «ciclista,»   7.32-7.96
           «motociclista,»  8.06-8.92   (pause 8.92-9.10)
           «conductor»      9.10-9.61   «o» 9.62   «pasajero.» 9.65-10.37
         Each reticle LOCKS ~0.15s after its role word starts. */

      /* ---- camera: one slow push under the whole shot (photo + tracking
         worlds get the identical tween, so reticles never slide) --------- */
      tl.fromTo(["#f03-pworld", "#f03-tworld"], { scale: 1 }, { scale: 1.045, duration: 19.6, ease: "power3.inOut" }, 0);

      /* ---- 0-1.1s · the feed settles in (visible from frame 0) ---------- */
      tl.fromTo("#f03-photo", { opacity: 0.35 }, { opacity: 1, duration: 1.1, ease: "power3.out" }, 0);

      /* ---- 1.9-4.5s · headline by mask («todos los colaboradores» /
         «sin importar su cargo») ----------------------------------------- */
      tl.fromTo("#f03-sep", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.9);
      tl.fromTo("#f03-hl1", { yPercent: 115 }, { yPercent: 0, duration: 0.75, ease: "power3.out" }, 2.2);
      tl.fromTo("#f03-hl2", { yPercent: 115 }, { yPercent: 0, duration: 0.75, ease: "power3.out" }, 3.7);

      /* ---- 5.0-6.0s · «Y a cada rol:» — the tracking system arms: one scan
         pass, and every candidate on the road gets a faint mark ---------- */
      tl.fromTo("#f03-scan", { y: 110 }, { y: 820, duration: 1.0, ease: "power3.inOut" }, 5.0);
      tl.fromTo("#f03-scan", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power3.out" }, 5.0);
      tl.fromTo("#f03-scan", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power3.in", immediateRender: false }, 5.8);
      var CAND_AT = [5.25, 5.5, 5.62, 5.44, 5.7, 5.34, 5.4, 5.56, 5.18, 5.12];
      for (var q = 0; q < CAND_AT.length; q++) {
        tl.fromTo("#f03-cand-" + q, { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 0.55, duration: 0.3, ease: "power3.out" }, CAND_AT[q]);
      }

      /* ---- the five reticles ----------------------------------------------
         box = lock pose [left, top, w, h]; A / B = search poses as
         [dx, dy, size factor] about the lock centre. */
      var RET = [
        { n: 1, box: [1167, 206, 76, 132], lock: 6.3,  A: [-70, 46, 1.7],  B: [22, -14, 1.3] },
        { n: 2, box: [819, 583, 64, 64],   lock: 7.48, A: [64, -40, 2.0],  B: [-16, 12, 1.35] },
        { n: 3, box: [881, 408, 64, 64],   lock: 8.22, A: [-58, -36, 2.0], B: [14, 10, 1.35] },
        { n: 4, box: [1306, 545, 70, 104], lock: 9.26, A: [-60, -44, 1.7], B: [16, 12, 1.3] },
        { n: 5, box: [1443, 665, 110, 74], lock: 9.84, A: [56, -40, 1.6],  B: [-12, 8, 1.25] }
      ];
      function pose(b, p) { return [b[0] + b[2] / 2 + p[0], b[1] + b[3] / 2 + p[1], b[2] * p[2], b[3] * p[2]]; }
      function cornerOff(b, P, k) {
        var l = P[0] - P[2] / 2, t = P[1] - P[3] / 2, r = P[0] + P[2] / 2, bt = P[1] + P[3] / 2;
        var L0 = b[0], T0 = b[1], R0 = b[0] + b[2], B0 = b[1] + b[3];
        if (k === 0) return { x: l - L0, y: t - T0 };
        if (k === 1) return { x: r - R0, y: t - T0 };
        if (k === 2) return { x: l - L0, y: bt - B0 };
        return { x: r - R0, y: bt - B0 };
      }
      /* one expanding hairline square: a 0.05s pop from 0 (so its pre-state is
         invisible, seek-safe), then it grows and fades. */
      function flash(id, peak, grow, dur, at) {
        tl.fromTo(id, { scale: 1, opacity: 0 }, { scale: 1, opacity: peak, duration: 0.05, ease: "none" }, at);
        tl.fromTo(id, { scale: 1, opacity: peak }, { scale: grow, opacity: 0, duration: dur, ease: "power3.out", immediateRender: false }, at + 0.05);
      }
      function maskIn(id, at, dur) {
        tl.fromTo(id, { yPercent: 110 }, { yPercent: 0, duration: dur, ease: "power3.out" }, at);
      }
      for (var i = 0; i < RET.length; i++) {
        var R = RET[i], T = R.lock;
        var PA = pose(R.box, R.A), PB = pose(R.box, R.B);
        for (var k = 0; k < 4; k++) {
          var el = "#f03-c" + R.n + "-" + k;
          var a = cornerOff(R.box, PA, k), b = cornerOff(R.box, PB, k);
          // acquire (appears at search pose A)
          tl.fromTo(el, { x: a.x, y: a.y, opacity: 0 }, { x: a.x, y: a.y, opacity: 0.8, duration: 0.2, ease: "power3.out" }, T - 0.82);
          // search A -> B
          tl.fromTo(el, { x: a.x, y: a.y }, { x: b.x, y: b.y, duration: 0.4, ease: "power3.inOut", immediateRender: false }, T - 0.72);
          // lock B -> box
          tl.fromTo(el, { x: b.x, y: b.y }, { x: 0, y: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, T - 0.32);
          tl.fromTo(el, { opacity: 0.8 }, { opacity: 1, duration: 0.15, ease: "power3.out", immediateRender: false }, T);
        }
        // lock click: centre cross + one expanding hairline square
        tl.fromTo("#f03-x-" + R.n, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, T);
        flash("#f03-flash-" + R.n, 0.8, 1.3, 0.55, T);
        // label: plate wipes from the reticle side, then ID + role by mask
        tl.fromTo("#f03-plate-" + R.n, { scaleX: 0 }, { scaleX: 1, duration: 0.36, ease: "power3.out" }, T + 0.04);
        maskIn("#f03-id-" + R.n, T + 0.14, 0.45);
        maskIn("#f03-name-" + R.n, T + 0.2, 0.55);
      }

      /* ---- 11.3s · PASAJERO turns red — the frame's single red focus.
         Lavender -> red is a crossfade of twin elements (paint only); the
         other four roles step back so the red one leads. ----------------- */
      var RED = 11.3, RD = 0.7;
      for (var r = 0; r < 4; r++) {
        tl.fromTo("#f03-c5-" + r, { opacity: 1 }, { opacity: 0, duration: RD, ease: "power3.inOut", immediateRender: false }, RED);
        tl.fromTo("#f03-r5-" + r, { opacity: 0 }, { opacity: 1, duration: RD, ease: "power3.inOut" }, RED);
      }
      tl.fromTo("#f03-x-5", { opacity: 1 }, { opacity: 0, duration: RD, ease: "power3.inOut", immediateRender: false }, RED);
      tl.fromTo("#f03-x-5r", { opacity: 0 }, { opacity: 1, duration: RD, ease: "power3.inOut" }, RED);
      tl.fromTo("#f03-bar-5r", { opacity: 0 }, { opacity: 1, duration: RD, ease: "power3.inOut" }, RED);
      tl.fromTo("#f03-glow-5", { opacity: 0 }, { opacity: 1, duration: 1.1, ease: "power3.out" }, RED + 0.2);
      flash("#f03-flash-5r", 0.9, 1.45, 0.8, RED + 0.35);
      for (var d = 1; d <= 4; d++) {
        tl.fromTo("#f03-ret-" + d, { opacity: 1 }, { opacity: 0.55, duration: 0.9, ease: "power3.inOut" }, RED);
        tl.fromTo("#f03-plate-" + d, { opacity: 1 }, { opacity: 0.72, duration: 0.9, ease: "power3.inOut" }, RED);
      }
      for (var e = 0; e < CAND_AT.length; e++) {
        tl.fromTo("#f03-cand-" + e, { opacity: 0.55 }, { opacity: 0.22, duration: 0.9, ease: "power3.inOut", immediateRender: false }, RED);
      }

      /* 12.4-20s · deliberate calm: the five roles held, PASAJERO in red;
         only the camera push finishes (still by 19.6s). */
      window.__timelines["03-roles"] = tl;
    })();
  </script>
