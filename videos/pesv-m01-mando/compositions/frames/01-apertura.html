  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var CX = 960, CY = 470;
      var GOLDEN = Math.PI * (3 - Math.sqrt(5));
      function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

      /* LOGO GEOMETRY (PNG alpha, 840x280): isotype ink x35-215 y27-219,
         wordmark ink x236-818 y86-265. Hero = 1260x420 (x1.5). Wrapper origin
         0 0; x/y = box top-left; scale relative to hero.
         isotype centred (960,470): local centre (187.5,184.5) -> box (772.5,285.5)
         full ink centred (960,460): local centre (639.75,219) -> box (320.25,241)
         bug 280px (s 0.2222), ink top-left (104,104) -> box (92.333,95) */
      var BUG_S = 280 / 1260;

      /* ---- 0.0-1.8s · THE SWARM ----------------------------------------
         40 particles: golden-angle ray from the isotype point, projected onto
         the frame edge, stepped depth + tumble (depth-scatter-assemble),
         power2.in. motion-blur-streak Path B: 2 ghosts on the same path + ease,
         lagged in time -> they string out only at peak speed (arrival). */
      var swarm = document.getElementById("f01-swarm");
      var N = 64, PERSP = 1200, GHOST_LAG = 0.03;
      var GHOST_OP = [1.0, 0.42, 0.2];
      var allParticles = [];
      for (var i = 0; i < N; i++) {
        var a = i * GOLDEN + 0.35, dx = Math.cos(a), dy = Math.sin(a);
        var tx = dx > 0 ? (1945 - CX) / dx : dx < 0 ? (-25 - CX) / dx : 1e9;
        var ty = dy > 0 ? (1105 - CY) / dy : dy < 0 ? (-25 - CY) / dy : 1e9;
        var reach = Math.min(tx, ty) * (0.84 + 0.2 * hash(i + 1));
        var z = 320 - (i / (N - 1)) * 640;
        var comp = (PERSP - z) / PERSP; // keep the PROJECTED start on the frame edge
        var sx = dx * reach * comp, sy = dy * reach * comp;
        var size = 7 + Math.floor(hash(i * 3 + 2) * 7); // 7..13px
        var isRed = i % 7 === 3;
        var baseOp = 1;
        var from = { x: sx, y: sy, z: z, rotationX: Math.sin(a) * 70, rotationY: Math.cos(a) * 70, rotation: (hash(i * 11 + 4) * 2 - 1) * 180 };
        var start = (i % 10) * 0.04;                 // 0 .. 0.36
        var arrive = 1.54 + ((i * 7) % 9) * 0.02;    // 1.54 .. 1.70
        for (var g = 0; g < 3; g++) {
          var el = document.createElement("div");
          el.className = "f01-p";
          el.style.width = size + "px";
          el.style.height = size + "px";
          el.style.marginLeft = -size / 2 + "px";
          el.style.marginTop = -size / 2 + "px";
          el.style.background = isRed ? "#E6423C" : "#8E8FC4";
          el.style.borderRadius = hash(i * 5 + 1) < 0.4 ? "50%" : "0";
          swarm.appendChild(el);
          allParticles.push(el);
          var lag = g * GHOST_LAG, op = baseOp * GHOST_OP[g];
          tl.fromTo(el, from, { x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, rotation: 0, duration: arrive - start, ease: "power2.in" }, start + lag);
          tl.fromTo(el, { opacity: 0 }, { opacity: op, duration: 0.22, ease: "power1.out" }, start + lag);
          /* collapse INTO the point and vanish: scale 0 + opacity 0, all done by 1.84s */
          tl.fromTo(el, { opacity: op, scale: 1 },
            { opacity: 0, scale: 0, duration: g === 0 ? 0.18 : 0.16, ease: "power1.in", immediateRender: false },
            g === 0 ? arrive - 0.04 : arrive - 0.1);
        }
      }
      tl.set(allParticles, { opacity: 0, scale: 0 }, 1.9); // hard clamp: none remains

      /* ---- 1.8-3.0s · THE MARK -----------------------------------------
         Clipped to isotype only. Uniform scale 0.86 -> 1 about the isotype
         centre (x/y linear in scale, same ease) + opacity, power3.out. */
      var lock = document.getElementById("f01-lock");
      tl.fromTo(lock,
        { x: CX - 187.5 * 0.86, y: CY - 184.5 * 0.86, scale: 0.86, opacity: 0, transformOrigin: "0px 0px" },
        { x: 772.5, y: 285.5, scale: 1, opacity: 1, duration: 1.2, ease: "power3.out" }, 1.8);

      /* Ring pulse, 2px. Reserve = isotype ink + 210px; all isotype ink lies
         within 197.3px of (960,470), so the reserve is inside r 407.3. Ring
         starts at r 414 (inner edge 413) and only grows; gone before 4.5s. */
      tl.fromTo("#f01-ring", { opacity: 0 }, { opacity: 0.95, duration: 0.08, ease: "none" }, 2.05);
      tl.fromTo("#f01-ring", { attr: { r: 414 } }, { attr: { r: 900 }, duration: 1.0, ease: "power2.out" }, 2.05);
      tl.fromTo("#f01-ring", { opacity: 0.95 }, { opacity: 0, duration: 0.92, ease: "power2.in", immediateRender: false }, 2.13);

      /* RESERVE OCCLUDER states (core rect = visible ink + margin).
         ISO : L 615 T 116 R 1311.36 (clip edge + 210) B 893 (full ink bottom + 210)
         HERO: L 162.75 T 71.5 R 1790.25 B 848.5
         BUG : ink (104,104)-(365,183.33) + 44 -> L 60 T 60 R 409 B 227.33 */
      var occ = document.getElementById("f01-occ");
      var OCC_ISO = { x: 452.25, y: 44.5, scaleX: 696.36 / 1627.5, scaleY: 1 };
      var OCC_HERO = { x: 0, y: 0, scaleX: 1, scaleY: 1 };
      var OCC_BUG = { x: -102.75, y: -11.5, scaleX: 349 / 1627.5, scaleY: 167.3333 / 777 };
      gsap.set(occ, { x: OCC_ISO.x, y: OCC_ISO.y, scaleX: OCC_ISO.scaleX, scaleY: OCC_ISO.scaleY, transformOrigin: "64px 64px" });
      function occTo(fromS, toS, dur, ease) {
        return [occ, { x: fromS.x, y: fromS.y, scaleX: fromS.scaleX, scaleY: fromS.scaleY },
          { x: toS.x, y: toS.y, scaleX: toS.scaleX, scaleY: toS.scaleY, duration: dur, ease: ease, immediateRender: false }];
      }

      /* ---- 3.0-4.5s · THE HUD IGNITES ------------------------------------ */
      tl.fromTo("#f01-grid", { clipPath: "circle(0px at 960px 470px)" },
        { clipPath: "circle(1300px at 960px 470px)", duration: 1.3, ease: "power2.out" }, 3.0);
      tl.fromTo("#f01-scan", { y: -82 }, { y: 900, duration: 1.2, ease: "power1.inOut" }, 3.05);
      tl.fromTo("#f01-scan", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 3.05);
      tl.fromTo("#f01-scan", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, 4.05);
      tl.fromTo("#f01-ruler-l", { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power3.out" }, 3.35);
      tl.fromTo("#f01-ruler-r", { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power3.out" }, 3.47);
      var BR_DX = [48, -48, 48, -48], BR_DY = [36, 36, -36, -36], BR_AT = [3.55, 3.7, 3.85, 4.0];
      for (var b = 0; b < 4; b++) {
        tl.fromTo("#f01-br-" + b, { x: BR_DX[b], y: BR_DY[b], opacity: 0 }, { x: 0, y: 0, opacity: 0.6, duration: 0.5, ease: "power3.out" }, BR_AT[b]);
        tl.fromTo("#f01-br-" + b + " path", { strokeDashoffset: 258 }, { strokeDashoffset: 0, duration: 0.46, ease: "power2.out" }, BR_AT[b] + 0.04);
      }

      /* ---- 4.5-6.3s · THE WORDMARK UNFURLS — one continuous power3.inOut --
         Wrapper glide + clip open + occluder share window and ease. Every
         reserve edge is linear in progress here, so the occluder core tracks
         it exactly (right edge = clip edge + 210: the grid retreats in step). */
      var GLIDE_AT = 4.5, GLIDE_DUR = 1.8, GE = "power3.inOut";
      tl.fromTo(lock, { x: 772.5, y: 285.5 }, { x: 320.25, y: 241, duration: GLIDE_DUR, ease: GE, immediateRender: false }, GLIDE_AT);
      tl.fromTo("#f01-logo", { clipPath: "inset(0% 73.9% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: GLIDE_DUR, ease: GE, immediateRender: false }, GLIDE_AT);
      var og = occTo(OCC_ISO, OCC_HERO, GLIDE_DUR, GE);
      tl.fromTo(og[0], og[1], og[2], GLIDE_AT);

      /* ---- 6.3-7.9s · TELEMETRY (reserve bottom = 848.5; rule 862, label 874)
         hacker-flip decode: per-char rotateX 90 -> 0 hinged at baseline, seeded
         glyph flicker, target clicks in at 60%. The hidden TARGET glyph holds
         each cell's width, so the centred row never reflows. */
      tl.fromTo("#f01-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.36, ease: "power2.out" }, 6.3);
      var labelEl = document.getElementById("f01-label");
      var TXT = labelEl.getAttribute("data-text");
      var GLY = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+<>/";
      function pseudoGlyph(seed) { var h = ((seed * 9301 + 49297) % 233280) / 233280; return GLY.charAt(Math.floor(h * GLY.length)); }
      gsap.set(labelEl, { xPercent: -50, transformOrigin: "0% 0%" });
      function addFlip(o, t, f, idx, at) {
        var st = { p: 0 };
        tl.fromTo(st, { p: 0 }, {
          p: 1, duration: 0.5, ease: "power3.out",
          onUpdate: function () {
            if (st.p < 0.6) {
              t.style.visibility = "hidden";
              f.textContent = st.p > 0 ? pseudoGlyph(idx * 1000 + Math.floor(st.p * 9)) : "";
            } else {
              /* "inherit", never "visible": an explicit visible on a child punches
                 through the hidden scene host and leaks the glyph into later frames */
              t.style.visibility = "inherit";
              f.textContent = "";
            }
            o.style.transform = "rotateX(" + (90 - st.p * 90).toFixed(2) + "deg)";
            o.style.opacity = String(Math.min(1, st.p * 2));
          }
        }, at);
      }
      for (var c = 0, ci = 0; c < TXT.length; c++) {
        var chTxt = TXT.charAt(c);
        var outer = document.createElement("span"); outer.className = "f01-ch"; outer.setAttribute("data-layout-allow-overlap", "");
        var tgt = document.createElement("span"); tgt.setAttribute("data-layout-allow-overlap", ""); tgt.textContent = chTxt === " " ? " " : chTxt;
        var flk = document.createElement("span"); flk.className = "f01-ch-f"; flk.setAttribute("aria-hidden", "true");
        outer.appendChild(tgt); outer.appendChild(flk); labelEl.appendChild(outer);
        outer.style.opacity = "0"; outer.style.transform = "rotateX(90deg)"; tgt.style.visibility = "hidden";
        if (chTxt !== " ") { addFlip(outer, tgt, flk, ci++, 6.45 + c * 0.022); }
      }

      /* ---- 7.9-9.4s · THE MARK BECOMES A BRAND BUG ----------------------
         Lockup -> 280px, ink top-left (104,104): 44px clear on every side,
         which also clears the top-left bracket arms (x/y <= 58). Rule + label
         shrink with it (0.6) to y 232/242, below the bug's clear space

      var GLITCH_AT = 12.74, GLITCH_DUR = 0.26, JITTER_STEP = 1 / 24, MAX_SPLIT = 12;
