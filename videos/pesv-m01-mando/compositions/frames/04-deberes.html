  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---- static chrome: telemetry label rebuilt exactly as 01 leaves it
         (per-char inline-blocks, nbsp for spaces, rotateX 0, opacity 1) ---- */
      var labelEl = document.getElementById("f04-label");
      var TXT = labelEl.getAttribute("data-text");
      for (var c = 0; c < TXT.length; c++) {
        var ch = TXT.charAt(c);
        var outer = document.createElement("span");
        outer.className = "f04-ch";
        outer.setAttribute("data-layout-allow-overlap", "");
        outer.style.transform = "rotateX(0deg)";
        outer.textContent = ch === " " ? " " : ch;
        labelEl.appendChild(outer);
      }

      /* VO (04.wav placed at 1.5s; measured pauses): «Tres deberes.» 1.50-2.22 ·
         «Exigir condiciones seguras, sin confrontar.» 2.54-4.62 · «Cumplir
         cinturón, postura y protocolos.» 4.90-7.86 · «Advertir, solicitar
         corrección y reportar.» 8.10-10.98. */

      /* ---- camera: one slow push under the whole shot (chrome is outside) -- */
      tl.fromTo("#f04-world", { scale: 0.972 }, { scale: 1, duration: 20.4, ease: "power3.inOut" }, 0);

      /* ---- photo drift inside each screen (slow, whole shot) --------------- */
      tl.fromTo("#f04-photo-1", { scale: 1.1 }, { scale: 1.0, duration: 20.4, ease: "power3.inOut" }, 0);
      tl.fromTo("#f04-photo-2", { scale: 1.1 }, { scale: 1.0, duration: 20.4, ease: "power3.inOut" }, 0);
      tl.fromTo("#f04-photo-3", { scale: 1.34 }, { scale: 1.2, duration: 20.4, ease: "power3.inOut" }, 0);

      /* ---- 0.15-1.6s · CASCADE ASSEMBLY (center-outward expansion) ---------
         All three leave the frame centre (960) and fan out to their columns,
         staggered left -> right; out-ease only. */
      var MON_CX = [400, 960, 1520];
      var EXP_AT = 0.15, EXP_DUR = 1.25, EXP_STAGGER = 0.14;
      for (var m = 0; m < 3; m++) {
        tl.fromTo("#f04-slot-" + (m + 1),
          { x: 960 - MON_CX[m], y: 24, scale: 0.6, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: EXP_DUR, ease: "power3.out" }, EXP_AT + m * EXP_STAGGER);
      }

      /* ---- 1.45-2.6s · «Tres deberes.» — the three screens power on, one per
         beat: a lavender scan line opens, then the picture unrolls from it. */
      var ON_AT = [1.45, 1.7, 1.95];
      for (var p = 0; p < 3; p++) {
        var n = p + 1, at = ON_AT[p];
        tl.fromTo("#f04-scanl-" + n, { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, at);
        tl.fromTo("#f04-screen-" + n, { clipPath: "inset(49.5% 0% 49.5% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: 0.62, ease: "power3.inOut" }, at + 0.16);
        tl.fromTo("#f04-scanl-" + n, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power3.in", immediateRender: false }, at + 0.4);
        tl.fromTo("#f04-flash-" + n, { opacity: 0.4 }, { opacity: 0, duration: 0.7, ease: "power3.out" }, at + 0.16);
      }

      /* ---- DEPTH-OF-FIELD STATES (rack focus) ------------------------------
         F = forward + sharp · B = back, defocused, dimmed · N = neutral.
         Every rack is fromTo from the exact state the previous rack left, so
         the hand-off is continuous and seek-safe. */
      var F = { scale: 1.12, "--dof": "0px", opacity: 1 };
      var B = { scale: 0.95, "--dof": "7px", opacity: 0.5 };
      var N = { scale: 1, "--dof": "0px", opacity: 1 };
      var RACK_DUR = 0.9, RE = "power3.inOut";
      function rack(n, from, to, at) {
        var toV = { scale: to.scale, "--dof": to["--dof"], opacity: to.opacity, duration: RACK_DUR, ease: RE, immediateRender: false };
        tl.fromTo("#f04-mon-" + n, { scale: from.scale, "--dof": from["--dof"], opacity: from.opacity }, toV, at);
      }
      function raise(n, z, at) { tl.set("#f04-slot-" + n, { zIndex: z }, at); }
      /* masks: yPercent 110 -> 0 (text never fades in) */
      function maskIn(id, at, dur) {
        tl.fromTo(id, { yPercent: 110 }, { yPercent: 0, duration: dur || 0.7, ease: "power3.out" }, at);
      }
      function dimDuty(n, a, b, at) {
        tl.fromTo("#f04-duty-" + n, { opacity: a }, { opacity: b, duration: RACK_DUR, ease: RE, immediateRender: false }, at);
      }

      /* halo geometry: column pitch 560px; focus scale 1.12 */
      var PITCH = 560;
      var halo = "#f04-halo";
      tl.fromTo(halo, { x: 0, scale: 1.24, opacity: 0 }, { x: 0, scale: 1.12, opacity: 1, duration: 0.8, ease: "power3.out" }, 2.6);

      /* ---- 2.45s · TURN 1 — DEBER 01 «Exigir condiciones seguras» -------- */
      var T1 = 2.45;
      raise(1, 2, T1);
      rack(1, N, F, T1);
      rack(2, N, B, T1);
      rack(3, N, B, T1);
      maskIn("#f04-d1-tag", 2.55, 0.6);
      maskIn("#f04-d1-l1", 2.65);
      maskIn("#f04-d1-l2", 3.0);
      maskIn("#f04-d1-sub", 3.9);          // «sin confrontar»

      /* ---- 4.8s · TURN 2 — DEBER 02 «Cinturón, postura y protocolos» ----- */
      var T2 = 4.8;
      raise(2, 2, T2);
      raise(1, 1, T2 + RACK_DUR);
      rack(1, F, B, T2);
      rack(2, B, F, T2);
      tl.fromTo(halo, { x: 0 }, { x: PITCH, duration: RACK_DUR, ease: RE, immediateRender: false }, T2);
      tl.fromTo(halo, { opacity: 1 }, { opacity: 0.3, duration: RACK_DUR / 2, ease: "power3.in", immediateRender: false }, T2);
      tl.fromTo(halo, { opacity: 0.3 }, { opacity: 1, duration: RACK_DUR / 2, ease: "power3.out", immediateRender: false }, T2 + RACK_DUR / 2);
      dimDuty(1, 1, 0.4, T2);
      maskIn("#f04-d2-tag", 4.95, 0.6);
