  </style>

  <div id="root" data-composition-id="05-principio" data-start="0" data-duration="16" data-width="1920" data-height="1080">
    <!-- 0 · full-bleed navy ground -->
    <div id="f05-ground-layer" class="clip f05-layer f05-ground" data-start="0" data-duration="16" data-track-index="0"></div>
    <!-- 1 · HUD grid (fully open, as 01 leaves it) -->
    <div id="f05-grid-layer" class="clip f05-layer" data-start="0" data-duration="16" data-track-index="1">

    <!-- 2 · reserve occluder around the brand bug -->
    <div id="f05-occ-layer" class="clip f05-layer" data-start="0" data-duration="16" data-track-index="2">

    <!-- 4 · HUD chrome (static) -->
    <div id="f05-hud-layer" class="clip f05-layer" data-start="0" data-duration="16" data-track-index="4">
      <div class="f05-ruler f05-ruler-l"></div>
      <div class="f05-ruler f05-ruler-r"></div>
      <div class="f05-br f05-br-tl"><svg viewBox="0 0 130 130"><path d="M 1 129 L 1 1 L 129 1" /></svg></div>
      <div class="f05-br f05-br-tr"><svg viewBox="0 0 130 130"><path d="M 1 1 L 129 1 L 129 129" /></svg></div>
      <div class="f05-br f05-br-bl"><svg viewBox="0 0 130 130"><path d="M 129 129 L 1 129 L 1 1" /></svg></div>
      <div class="f05-br f05-br-br"><svg viewBox="0 0 130 130"><path d="M 129 1 L 129 129 L 1 129" /></svg></div>

      <div class="f05-label" id="f05-label" data-text="CAPACITACIÓN PESV · MÓDULO 01 · ACTOR VIAL" aria-label="CAPACITACIÓN PESV · MÓDULO 01 · ACTOR VIAL"></div>
      <div class="f05-section">05 · PRINCIPIO CLAVE</div>

    <!-- 5 · THE GAUGE + THE SENTENCE (inside one slow camera push) -->
    <div id="f05-world" class="clip f05-layer f05-world" data-start="0" data-duration="16" data-track-index="5">

        <defs>
          <linearGradient id="f05-band-grad" gradientUnits="userSpaceOnUse" x1="576" y1="0" x2="1344" y2="0">
            <stop offset="0" stop-color="#A7BCCC" stop-opacity="0.22" />
            <stop offset="0.6" stop-color="#A7BCCC" stop-opacity="0.85" />
            <stop offset="1" stop-color="#F2F7FF" stop-opacity="1" />
          </linearGradient>
        </defs>
        <!-- pivot C = (960, 590). No numerals, no scale values: only REDUCE / AUMENTA. -->
        <path id="f05-face" class="f05-face" d="M 654 590 A 306 306 0 0 1 1266 590 Z" />
        <path id="f05-arc-out" class="f05-hair f05-hair-out" d="M 530 590 A 430 430 0 0 1 1390 590" />
        <path id="f05-arc-in" class="f05-hair f05-hair-in" d="M 654 590 A 306 306 0 0 1 1266 590" />
        <path id="f05-band" class="f05-band" d="M 576 590 A 384 384 0 0 1 1344 590" />
        <path id="f05-stub-l" class="f05-stub" d="M 530 590 L 654 590" />
        <path id="f05-stub-r" class="f05-stub" d="M 1390 590 L 1266 590" />
        <g id="f05-ticks"></g>
        <polygon id="f05-mark" class="f05-mark" points="950,148 970,148 960,162" />

      <div class="f05-end f05-end-l"><span class="f05-wm"><span class="f05-w" id="f05-end-l">REDUCE</span></span></div>

      <div class="f05-sline f05-sline-1"><span class="f05-wm"><span class="f05-w" id="f05-w0">Cada</span></span> <span class="f05-wm"><span class="f05-w" id="f05-w1">decisión</span></span> <span class="f05-wm"><span class="f05-w" id="f05-w2">del</span></span> <span class="f05-wm"><span class="f05-w" id="f05-w3">pasajero</span></span> <span class="f05-wm"><span class="f05-w" id="f05-w4">puede</span></span></div>
      <div class="f05-sline f05-sline-2"><span class="f05-emph"><span class="f05-wm"><span class="f05-w" id="f05-w5">aumentar</span></span> <span class="f05-wm"><span class="f05-w" id="f05-w6">o</span></span> <span class="f05-wm"><span class="f05-w" id="f05-w7">reducir</span></span><i class="f05-uline" id="f05-uline"></i></span> <span class="f05-wm"><span class="f05-w" id="f05-w8">la</span></span> <span class="f05-wm"><span class="f05-w" id="f05-w9">exposición</span></span> <span class="f05-wm"><span class="f05-w" id="f05-w10">al</span></span> <span class="f05-wm"><span class="f05-w" id="f05-w11">riesgo.</span></span></div>

    <!-- 6 · the official RiskMann bug — TOPMOST, static, nothing over it -->

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var CX = 960, CY = 590, SVG_O = "960 590";

      /* ---- static chrome: telemetry label rebuilt exactly as 01 leaves it
         (per-char inline-blocks, nbsp for spaces, rotateX 0, opacity 1) ---- */
      var labelEl = document.getElementById("f05-label");
      var TXT = labelEl.getAttribute("data-text");
      for (var c = 0; c < TXT.length; c++) {
        var ch = TXT.charAt(c);
        var outer = document.createElement("span");
        outer.className = "f05-ch";
        outer.setAttribute("data-layout-allow-overlap", "");
        outer.style.transform = "rotateX(0deg)";
        outer.textContent = ch === " " ? " " : ch;
        labelEl.appendChild(outer);
      }

      /* ---- ticks: 37 evenly spaced graduations, NO values ---------------- */
      var SVGNS = "http://www.w3.org/2000/svg";
      var ticksG = document.getElementById("f05-ticks");
      var ticks = [];
      for (var i = 0; i <= 36; i++) {
        var th = (180 - i * 5) * Math.PI / 180;
        var major = i % 6 === 0;
        var r0 = major ? 322 : 336, r1 = 356;
        var ln = document.createElementNS(SVGNS, "line");
        ln.setAttribute("x1", (CX + r0 * Math.cos(th)).toFixed(2));
        ln.setAttribute("y1", (CY - r0 * Math.sin(th)).toFixed(2));
        ln.setAttribute("x2", (CX + r1 * Math.cos(th)).toFixed(2));
        ln.setAttribute("y2", (CY - r1 * Math.sin(th)).toFixed(2));
        ln.setAttribute("class", "f05-tick");
        ln.setAttribute("data-op", major ? "0.75" : "0.35");
        ticksG.appendChild(ln);
        ticks.push(ln);
      }

      /* ---- camera: one slow push under the whole shot ------------------- */
      tl.fromTo("#f05-world", { scale: 0.965 }, { scale: 1, duration: 15.4, ease: "power3.inOut" }, 0);

      /* ---- 0.1-1.6s · the instrument traces itself (svg-path-draw) ------ */
      function draw(id, at, dur, ease) {
        var p = document.getElementById(id);
        var len = p.getTotalLength();
        p.style.strokeDasharray = len + " " + len;
        tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: ease }, at);
      }
      draw("f05-arc-out", 0.1, 1.1, "power2.out");
      draw("f05-arc-in", 0.22, 1.05, "power2.out");
      draw("f05-band", 0.35, 1.25, "power3.inOut");
      draw("f05-stub-l", 0.12, 0.5, "power2.out");
      draw("f05-stub-r", 1.1, 0.5, "power2.out");
      tl.fromTo("#f05-face", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.3);
      for (var t = 0; t < ticks.length; t++) {
        tl.fromTo(ticks[t], { opacity: 0 }, { opacity: parseFloat(ticks[t].getAttribute("data-op")), duration: 0.22, ease: "power2.out" }, 0.3 + t * 0.022);
      }
      /* end labels by mask */
      tl.fromTo("#f05-end-l", { yPercent: 120 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, 1.0);
      tl.fromTo("#f05-end-r", { yPercent: 120 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, 1.45);

      /* hub + needle wake at the REDUCE rest */
      tl.fromTo("#f05-hub", { scale: 0, svgOrigin: SVG_O }, { scale: 1, duration: 0.5, ease: "power3.out" }, 0.85);
      var needle = document.getElementById("f05-needle");
      tl.fromTo(needle, { rotation: -84, scaleY: 0, svgOrigin: SVG_O }, { rotation: -84, scaleY: 1, duration: 0.5, ease: "power3.out" }, 1.0);

      /* ---- 1.5-9.4s · the needle swings WITH the sentence -----------------
         Each swing is its own fromTo chained end->start: seek-safe, no repeat /
         yoyo. VO (from ~1.5s): «Cada decisión del pasajero» 1.5-3.8 · «puede»
         3.85 · «aumentar» 4.45 · «o reducir» 5.15-6.5 · «la exposición al
         riesgo» 6.6-7.9. Then a damped settle onto the centre. */
      var SWINGS = [
        [-84, -22, 1.55, 1.8],  // «Cada decisión del pasajero»: it starts to move
        [-22, -44, 3.35, 0.95], // «puede»: hesitation
        [-44, 74, 4.35, 0.8],   // «aumentar» -> towards AUMENTA
        [74, -68, 5.3, 0.95],   // «o reducir» -> towards REDUCE
        [-68, 32, 6.5, 0.75],   // «la exposición»
        [32, -14, 7.25, 0.7],   // «al riesgo»
        [-14, 6, 7.95, 0.65],
        [6, 0, 8.6, 0.8]        // settles at the centre
      ];
      for (var s = 0; s < SWINGS.length; s++) {
        var sw = SWINGS[s];
        tl.fromTo(needle, { rotation: sw[0] },
          { rotation: sw[1], duration: sw[3], ease: s === SWINGS.length - 1 ? "power3.out" : "power3.inOut", immediateRender: false }, sw[2]);
      }

      /* ---- the sentence, word by word by mask, on the voice --------------- */
      var WORD_AT = [1.45, 1.8, 2.5, 2.75, 3.8, 4.4, 5.1, 5.3, 6.5, 6.65, 7.3, 7.45];
      for (var w = 0; w < WORD_AT.length; w++) {
        tl.fromTo("#f05-w" + w, { yPercent: 120 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, WORD_AT[w]);
      }

      /* ---- 9.3-10.7s · after the settle: centre mark + the two verbs underlined */
      tl.fromTo("#f05-mark", { y: -14, opacity: 0 }, { y: 0, opacity: 0.9, duration: 0.6, ease: "power3.out" }, 9.3);
      tl.fromTo("#f05-uline", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.inOut" }, 9.9);

      /* 10.7-16s · hold; only the camera finishes its push. */
      window.__timelines["05-principio"] = tl;
    })();
  </script>
