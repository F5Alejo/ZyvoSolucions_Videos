  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      /* ---- static chrome: rebuild 01's decoded label in its landed state

      var TXT = labelEl.getAttribute("data-text");

        var chTxt = TXT.charAt(c);
        var outer = document.createElement("span"); outer.className = "f07-ch"; outer.setAttribute("data-layout-allow-overlap", "");
        var tgt = document.createElement("span"); tgt.setAttribute("data-layout-allow-overlap", ""); tgt.textContent = chTxt === " " ? " " : chTxt;

        outer.appendChild(tgt); outer.appendChild(flk); labelEl.appendChild(outer);
        if (chTxt === " ") { outer.style.opacity = "0"; outer.style.transform = "rotateX(90deg)"; tgt.style.visibility = "hidden"; }
        else { outer.style.opacity = "1"; outer.style.transform = "rotateX(0.00deg)"; }
      }

      var E3 = "power3.out";

      /* ---- 0.0-1.4s · the console powers up (hero visible by 0.5s) ---- */

      tl.fromTo("#f07-divider", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.inOut" }, 0.7);

      /* ---- 2.0s · «Piense, converse y responda.» ---- */
      maskIn("#f07-eyebrow", 2.0, 0.75);

      /* ---- questions, one per VO line: numeral, two masked lines, then the
         answer rule draws once the question has been read ---- */
      var QS = [
        { n: "#f07-n1", a: "#f07-q1a", b: "#f07-q1b", ans: "#f07-ans1", light: "#f07-light-1", at: 4.6, rule: 7.0 },
        { n: "#f07-n2", a: "#f07-q2a", b: "#f07-q2b", ans: "#f07-ans2", light: "#f07-light-2", at: 9.2, rule: 11.2 },
        { n: "#f07-n3", a: "#f07-q3a", b: "#f07-q3b", ans: "#f07-ans3", light: "#f07-light-3", at: 12.8, rule: 14.8 }
      ];
      for (var q = 0; q < QS.length; q++) {
        var Q = QS[q];
        tl.fromTo(Q.light, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: E3 }, Q.at);
        maskIn(Q.n, Q.at, 0.6);
        maskIn(Q.a, Q.at + 0.1, 0.75);
        maskIn(Q.b, Q.at + 0.24, 0.75);
        tl.fromTo(Q.ans, { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "power3.inOut" }, Q.rule);
      }

      /* ---- 16.3s · «Pause el video…» — the ring traces ONCE (svg-path-draw:
         measured length, dashoffset len -> 0). No ticks, no running clock. ---- */
      var arc = document.getElementById("f07-arc");
      var LEN = arc.getTotalLength() + 1;
      arc.style.strokeDasharray = LEN + " " + LEN;
      arc.style.strokeDashoffset = String(LEN);
      tl.fromTo(arc, { strokeDashoffset: LEN }, { strokeDashoffset: 0, duration: 4.4, ease: "power3.inOut" }, 16.3);
      maskIn("#f07-time", 16.5, 0.8);
      maskIn("#f07-plabel", 16.95, 0.7);

      /* ---- 20.7-28s · the reading pause. Nothing moves. ---- */
      window.__timelines["07-retroalimentacion"] = tl;
