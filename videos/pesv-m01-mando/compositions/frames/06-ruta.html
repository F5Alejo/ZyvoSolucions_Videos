  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---- static chrome: telemetry label rebuilt exactly as 01 leaves it
         (per-char inline-blocks, explicit \u00A0 escape for spaces, rotateX 0, opacity 1) ---- */
      var labelEl = document.getElementById("f06-label");
      var TXT = labelEl.getAttribute("data-text");
      for (var c = 0; c < TXT.length; c++) {
        var ch = TXT.charAt(c);
        var outer = document.createElement("span");
        outer.className = "f06-ch";
        outer.setAttribute("data-layout-allow-overlap", "");
        outer.style.transform = "rotateX(0deg)";
        outer.textContent = ch === " " ? "\u00A0" : ch;
        labelEl.appendChild(outer);
      }
      /* mask-hidden text sits below its line until revealed; rest state verified clean */
      var masked = document.querySelectorAll("#f06-world .f06-i, #f06-read-l");
      for (var k = 0; k < masked.length; k++) masked[k].setAttribute("data-layout-allow-overlap", "");

      /* VO (06.wav placed at 1.5s; measured on its energy envelope):
         «Es el primero» 1.52-2.26 · «de una ruta de ocho» 2.30-3.70 ·
         «módulos» 3.82-4.58 · «para convertir» 4.66-5.70 · «intención»
         5.78-6.22 · «en conducta» 6.30-7.06. */

      /* ================= CAMERA — one .world wrapper, PAN mode =================
         cam.fx = world x held at screen centre; cam.s = scale; cam.y = vertical
         offset. Single-wrapper form about origin (960,540): x = -s*(fx-960). */
      var world = document.getElementById("f06-world");
      var cam = { fx: 200, s: 1.7, y: 56 };
      function applyCamera() {
        var x = -cam.s * (cam.fx - 960);
        world.style.transform = "translate(" + x.toFixed(3) + "px," + cam.y.toFixed(3) + "px) scale(" + cam.s.toFixed(5) + ")";
      }
      applyCamera(); // seed frame 0: close on the start of the route

      /* directional streak on the world during the lateral travel leg */
      var blurNode = document.getElementById("f06-streak-blur");
      var blur = { v: 0 };
      function writeBlur() { blurNode.setAttribute("stdDeviation", blur.v.toFixed(3) + " 0"); }
      writeBlur(); // seeded at 0 — an inOut leg streaks mid-leg, not at t=0

      /* leg A · 0.1-2.0 — slow approach; station 01 lands centred on «el primero» */
      tl.fromTo(cam, { fx: 200, s: 1.7 }, { fx: 380, s: 1.55, duration: 1.9, ease: "power3.inOut", onUpdate: applyCamera }, 0.1);

      /* leg B · 2.35-3.5 — lateral travel 01 -> 08 at s 1.55, streak peaks mid-leg */
      var TRAVEL_AT = 2.35, TRAVEL_DUR = 1.15, PEAK = 9;
      tl.fromTo(cam, { fx: 380 }, { fx: 1300, duration: TRAVEL_DUR, ease: "power3.inOut", immediateRender: false, onUpdate: applyCamera }, TRAVEL_AT);
      tl.fromTo(blur, { v: 0 }, { v: PEAK, duration: TRAVEL_DUR / 2, ease: "power3.in", immediateRender: false, onUpdate: writeBlur }, TRAVEL_AT);
      tl.fromTo(blur, { v: PEAK }, { v: 0, duration: TRAVEL_DUR / 2, ease: "power3.out", immediateRender: false, onUpdate: writeBlur }, TRAVEL_AT + TRAVEL_DUR / 2);

      /* leg C · 3.4-4.65 — the camera pulls back: all eight, landing on «ocho módulos» */
      tl.fromTo(cam, { s: 1.55, y: 56 }, { s: 1, y: 0, duration: 1.25, ease: "power3.inOut", immediateRender: false, onUpdate: applyCamera }, 3.4);
      tl.fromTo(cam, { fx: 1300 }, { fx: 960, duration: 1.15, ease: "power3.inOut", immediateRender: false, onUpdate: applyCamera }, 3.5);

      /* leg D · 4.65-17.4 — barely-there settle drift, fully still by 17.4 */
      tl.fromTo(cam, { s: 1 }, { s: 1.02, duration: 12.75, ease: "power3.inOut", immediateRender: false, onUpdate: applyCamera }, 4.65);

      /* ================= THE ROUTE ================= */
      var LINE_X0 = 285, LINE_LEN = 1350;
      var NODE_X = [380, 545.714, 711.429, 877.143, 1042.857, 1208.571, 1374.286, 1540];
      function frac(x) { return (x - LINE_X0) / LINE_LEN; }
      /* inverse of power2.inOut — lets each node light exactly when the line reaches it */
      function inv2(p) { return p < 0.5 ? Math.sqrt(p / 2) : 1 - Math.sqrt((1 - p) / 2); }

      tl.fromTo("#f06-cap-a", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 0.0);
      /* line seg 1 · start -> node 01 */
      var F1 = frac(NODE_X[0]);
      tl.fromTo("#f06-line", { scaleX: 0 }, { scaleX: F1, duration: 0.4, ease: "power3.out" }, 0.05);
      /* line seg 2 · node 01 -> end, running ahead of the travelling camera */
      var SEG2_AT = 2.2, SEG2_DUR = 1.25;
      tl.fromTo("#f06-line", { scaleX: F1 }, { scaleX: 1, duration: SEG2_DUR, ease: "power2.inOut", immediateRender: false }, SEG2_AT);
      tl.fromTo("#f06-cap-b", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, SEG2_AT + SEG2_DUR - 0.05);

      function maskIn(id, at, dur) {
        tl.fromTo(id, { yPercent: 150 }, { yPercent: 0, duration: dur || 0.55, ease: "power3.out" }, at);
      }
      function popNode(n, at) {
        tl.fromTo("#f06-node-" + n, { scale: 0 }, { scale: 1, duration: 0.45, ease: "power3.out" }, at);
      }
      function station(n, at) {
        popNode(n, at);
        tl.fromTo("#f06-stem-" + n, { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power3.out" }, at + 0.05);
        maskIn("#f06-num-" + n, at + 0.1);
        maskIn("#f06-n" + n + "-1", at + 0.16);
        maskIn("#f06-n" + n + "-2", at + 0.22);
      }

      /* station 01 · node at 0.3 (hero on screen by 0.5), card by «Es el…», lit red on «primero» */
      popNode(1, 0.3);
      tl.fromTo("#f06-stem-1", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 0.5);
      maskIn("#f06-num-1", 0.65, 0.6);
      maskIn("#f06-n1-1", 1.5, 0.6);
      maskIn("#f06-n1-2", 1.6, 0.6);

      var LIT = 1.85;
      tl.fromTo("#f06-node-1", { backgroundColor: "#051427", borderColor: "#8E8FC4" },
        { backgroundColor: "#E6423C", borderColor: "#E6423C", duration: 0.35, ease: "power3.out", immediateRender: false }, LIT);
      tl.fromTo("#f06-node-1", { scale: 1 }, { scale: 1.18, duration: 0.5, ease: "power3.out", immediateRender: false }, LIT);
      tl.fromTo("#f06-ring", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, LIT);
      tl.fromTo("#f06-stem-1", { backgroundColor: "#8E8FC4" }, { backgroundColor: "#E6423C", duration: 0.35, ease: "power3.out", immediateRender: false }, LIT);
      tl.fromTo("#f06-pin-stem", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power3.out" }, LIT + 0.1);
      tl.fromTo("#f06-pin", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.out" }, LIT + 0.25);
      maskIn("#f06-pin-t", LIT + 0.4, 0.5);

      /* stations 02-08 · each lights the instant the drawn line reaches it */
      var NODE_T = [0];
      for (var s = 1; s < 8; s++) {
        var pr = (frac(NODE_X[s]) - F1) / (1 - F1);
        NODE_T[s] = SEG2_AT + SEG2_DUR * inv2(pr);
        station(s + 1, NODE_T[s]);
      }

      /* ================= «intención» -> «conducta» — the route is travelled ================= */
      maskIn("#f06-end-a", 5.78, 0.6);
      var RUN_AT = 5.8, RUN_DUR = 1.2;
      tl.fromTo("#f06-head", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, RUN_AT - 0.1);
      tl.fromTo("#f06-head", { x: 0 }, { x: LINE_LEN, duration: RUN_DUR, ease: "power2.inOut" }, RUN_AT);
      tl.fromTo("#f06-lit", { scaleX: 0 }, { scaleX: 1, duration: RUN_DUR, ease: "power2.inOut" }, RUN_AT);
      /* each passed station becomes "armed": node fills lavender (01 stays red) */
      for (var k = 1; k < 8; k++) {
        var tk = RUN_AT + RUN_DUR * inv2(frac(NODE_X[k]));
        tl.fromTo("#f06-node-" + (k + 1), { backgroundColor: "#051427", borderColor: "#8E8FC4" },
          { backgroundColor: "#8E8FC4", borderColor: "#F2F7FF", duration: 0.3, ease: "power3.out", immediateRender: false }, tk - 0.04);
      }
      maskIn("#f06-end-b", 6.35, 0.6);

      /* ================= back half · the camera-fixed readout ================= */
      maskIn("#f06-read-l", 7.6, 0.6);
      for (var g = 0; g < 8; g++) {
        tl.fromTo("#f06-seg-" + (g + 1), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 7.8 + g * 0.09);
      }
      tl.fromTo("#f06-seg-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut" }, 8.9);

      /* 9.6-18s · deliberate held read: all eight stations in view, only the
         settle drift finishes (still by 17.4). No exit — the root cut is the exit. */
      window.__timelines["06-ruta"] = tl;
    })();
  </script>
</template>
