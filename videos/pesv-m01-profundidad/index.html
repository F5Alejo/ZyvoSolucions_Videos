<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #F5F8FC; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #F5F8FC; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
      .ground { position: absolute; inset: 0; }
      .ground-paper { background: radial-gradient(1200px 760px at 50% 46%, #FFFFFF 0%, #F5F8FC 70%, #E9F1FA 100%); }
      .ground-navy { background: #0B2F6B; }
      .chrome { position: absolute; inset: 0; pointer-events: none; }
      .bug { position: absolute; left: 48px; top: 978px; width: 214px; height: 70px; border-radius: 35px; background: #FFFFFF;
             box-shadow: 0 0 0 1.5px rgba(11, 47, 107, 0.14); }
      .bug img { position: absolute; left: 22px; top: 9px; width: 138px; height: 52px; }
      .bar { position: absolute; left: 300px; top: 1010px; width: 1572px; height: 6px; border-radius: 3px; background: rgba(90, 167, 232, 0.28); overflow: hidden; }
      .bar-fill { position: absolute; inset: 0; background: #1565C0; transform: scaleX(0); transform-origin: 0 50%; }
    </style>
  </head>
  <body>

    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">
      <div id="ground-1" class="clip ground ground-paper" data-start="0" data-duration="8" data-track-index="0"></div>

      <!-- 0-1 s · three hard cuts, camera shake and a white flash: the hook lands in the first frame -->
      <div id="el-s00" class="scene" data-composition-id="s00-impacto"
           data-composition-src="compositions/s00-impacto.html"
           data-start="0" data-duration="1" data-track-index="4"></div>
      <div id="ground-2" class="clip ground ground-navy" data-start="8" data-duration="8" data-track-index="0"></div>

      <!-- registry block: the headline assembles out of a seeded particle cloud -->
      <div id="el-ptd" class="scene" data-composition-id="particle-text-dissolve"
           data-composition-src="compositions/components/particle-text-dissolve.html"
           data-variable-values='{"text":"TÚ NO CONDUCES.","direction":"in","density":"high","accent":"blue","exit":"none"}'
           data-start="1" data-duration="2" data-track-index="1"></div>

      <!-- our own 3D stage: the camera flies through the depth planes -->
      <div id="el-s01b" class="scene" data-composition-id="s01b-decides"
           data-composition-src="compositions/s01b-decides.html"
           data-start="3" data-duration="5" data-track-index="2"></div>

      <!-- registry block: the photo materialises from the particle field -->
      <div id="el-pir" class="scene" data-composition-id="particle-image-reveal"
           data-composition-src="compositions/components/particle-image-reveal.html"
           data-variable-values='{"density":"high","direction":"center","accent":"blue","exit":"none"}'
           data-start="8" data-duration="8" data-track-index="1"></div>

      <div id="el-s02b" class="scene" data-composition-id="s02b-texto"
           data-composition-src="compositions/s02b-texto.html"
           data-start="8" data-duration="8" data-track-index="3"></div>

      <div id="chrome" class="clip chrome" data-start="0" data-duration="16" data-track-index="5">
        <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
        <div class="bug" id="bug"><img src="assets/marca/riskmann_logo_color.png" alt="RiskMann by SOFU" /></div>
      </div>

      <audio id="mezcla" class="clip" src="assets/mezcla-profundidad.wav"
             data-start="0" data-duration="16" data-track-index="10"></audio>
    </div>
    <!-- the photo the particle field materialises (a slot, read at mount) -->
    <template data-slot="particle-image-reveal-image">
      <img src="assets/fotos/02-asiento-pasajero.jpg" alt="Cinturón cruzado visto desde el asiento del pasajero" />
    </template>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#bar-fill", { scaleX: 0 }, { scaleX: 16 / 60, duration: 16, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
