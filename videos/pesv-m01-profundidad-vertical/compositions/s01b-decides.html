<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: "Montserrat"; font-style: normal; font-weight: 100 900; font-display: block;
      src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: "Montserrat"; font-style: normal; font-weight: 100 900; font-display: block;
      src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Montserrat", sans-serif; }
    .s1b-layer { position: absolute; inset: 0; }
    .s1b-paper { background: radial-gradient(900px 1000px at 50% 44%, #FFFFFF 0%, #F5F8FC 70%, #E9F1FA 100%); }
    .s1b-shake { position: absolute; inset: -60px; will-change: transform; }

    /* 3D stage: the words live at different depths and the camera travels through them */
    .s1b-stage { position: absolute; inset: 0; perspective: 1200px; perspective-origin: 50% 46%; }
    .s1b-world { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
    .s1b-plane { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-style: preserve-3d; }
    .s1b-word { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; line-height: 1;

    .s1b-rail { position: absolute; left: 0; width: 1080px; height: 3px; background: rgba(11, 47, 107, 0.14); }

    .s1b-insert { position: absolute; inset: 0; overflow: hidden; opacity: 0; }

  <div id="root" data-composition-id="s01b-decides" data-start="0" data-duration="5" data-width="1080" data-height="1920">
    <div id="s1b-ground" class="clip s1b-layer s1b-paper" data-start="0" data-duration="5" data-track-index="0"></div>

    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var F = 1 / 30;

      /* 0.0 · the camera is already moving when the cut lands */
      tl.fromTo("#s1b-world", { z: -1100, rotationX: 6, rotationY: -5 },
        { z: 0, rotationX: 0, rotationY: 0, duration: 0.9, ease: "power3.out" }, 0);
      tl.fromTo("#s1b-pero", { z: -700, opacity: 0 }, { z: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 0.05);

      /* 0.5 · DECIDES. hits: flash, shake, and the word punches out of the depth */
      tl.fromTo("#s1b-dec", { z: -1500, opacity: 0, rotationX: 22 },
        { z: 0, opacity: 1, rotationX: 0, duration: 0.45, ease: "power4.out" }, 0.5);
      tl.set("#s1b-flash", { opacity: 1 }, 0.5);
      tl.set("#s1b-flash", { opacity: 0 }, 0.5 + 2 * F);
      tl.fromTo("#s1b-shake", { x: 0, y: 0 }, { x: 18, y: -10, duration: 2 * F, ease: "none" }, 0.5);
      tl.to("#s1b-shake", { x: 0, y: 0, duration: 4 * F, ease: "power2.out" }, 0.5 + 2 * F);

      /* 1.0 · the shot breathes: a slow push while the words hold */
      tl.fromTo("#s1b-world", { scale: 1 }, { scale: 1.04, duration: 1.0, ease: "sine.inOut", immediateRender: false }, 1.0);

      /* 2.0-2.9 · three hard inserts, one per half beat: image, tag, cut. No fades. */
      var INS = [
        ["#s1b-i1", "#s1b-i1-img", 2.0, 1.25, 1.1, -6, 0],
        ["#s1b-i2", "#s1b-i2-img", 2.3, 1.45, 1.28, 6, -4],
        ["#s1b-i3", "#s1b-i3-img", 2.6, 1.6, 1.42, 0, 6]
      ];
      INS.forEach(function (it) {
        tl.set(it[0], { opacity: 1 }, it[2]);
        tl.set(it[0], { opacity: 0 }, it[2] + 0.3);
        tl.fromTo(it[1], { scale: it[3], xPercent: it[5], yPercent: it[6] },
          { scale: it[4], duration: 0.3, ease: "none", immediateRender: false }, it[2]);
        tl.fromTo("#s1b-shake", { x: 0, y: 0 }, { x: -12, y: 8, duration: 2 * F, ease: "none", immediateRender: false }, it[2]);
        tl.to("#s1b-shake", { x: 0, y: 0, duration: 3 * F, ease: "power2.out" }, it[2] + 2 * F);
      });

      /* 2.9 · back on the words, one hard punch to seal the statement */
      tl.fromTo("#s1b-world", { scale: 1.12 }, { scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, 2.9);
      tl.set("#s1b-flash", { opacity: 1 }, 2.9);
      tl.set("#s1b-flash", { opacity: 0 }, 2.9 + F);

      /* 4.3 · the navy iris opens and becomes the next scene's ground */
      tl.fromTo("#s1b-iris", { scale: 0 }, { scale: 15, duration: 0.7, ease: "power3.in" }, 4.3);

      window.__timelines["s01b-decides"] = tl;
    })();
