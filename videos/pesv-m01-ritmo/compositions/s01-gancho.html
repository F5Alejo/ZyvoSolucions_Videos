<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: "Montserrat"; font-style: normal; font-weight: 100 900; font-display: block;
      src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: "Montserrat"; font-style: normal; font-weight: 100 900; font-display: block;
      src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;

    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Montserrat", sans-serif; }
    .s1-layer { position: absolute; inset: 0; }
    .s1-ground {
      background:
        radial-gradient(1200px 760px at 62% 58%, #FFFFFF 0%, rgba(255,255,255,0) 70%),
        #F5F8FC;

    /* ghost numeral: slow drift under the beat, the only continuous motion */
    .s1-ghost {
      position: absolute; left: 980px; top: 60px; font-size: 880px; font-weight: 900; line-height: 1;
      color: transparent; -webkit-text-stroke: 3px #DCE8F5; letter-spacing: -0.04em; white-space: nowrap;
    }

    .s1-a { position: absolute; left: 180px; top: 250px; transform-origin: 0 0; }
    .s1-row { display: flex; gap: 0.22em; font-size: 240px; font-weight: 900; line-height: 1; color: #0B2F6B; letter-spacing: -0.02em; white-space: nowrap; }
    .s1-row + .s1-row { margin-top: 12px; }

    .s1-b { position: absolute; left: 0; width: 1920px; text-align: center; white-space: nowrap; }

    .s1-circle path { fill: none; stroke: #0B2F6B; stroke-width: 9; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }

    /* iris: grows from the circled word into scene 02's navy ground */
    .s1-iris { position: absolute; left: 860px; top: 590px; width: 200px; height: 200px; border-radius: 50%; background: #0B2F6B; transform: scale(0); }

  <div id="root" data-composition-id="s01-gancho" data-start="0" data-duration="8" data-width="1920" data-height="1080">
    <div id="s1-ground" class="clip s1-layer s1-ground" data-start="0" data-duration="8" data-track-index="0">

      <div class="s1-a" id="s1-a">

        <div class="s1-row">

            <svg class="s1-strike" viewBox="0 0 1560 170" aria-hidden="true" data-layout-allow-overlap>

    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var P = 0.5;                       /* 120 BPM: one pulse = 0.5 s */
      function B(n) { return n * P; }

      /* ambient: the ghost numeral drifts left for the whole scene */
      tl.fromTo("#s1-ghost", { x: 0 }, { x: -140, duration: 8, ease: "none" }, 0);

      /* ---- PHASE A — three words, three different hits ---- */
      /* beat 1 · TÚ — scale + blur slam */
      tl.set("#s1-tu", { opacity: 1 }, B(1));
      tl.fromTo("#s1-tu", { scale: 1.7, filter: "blur(18px)", transformOrigin: "30% 60%" },
        { scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, B(1));
      /* beat 2 · NO — side snap from the right */
      tl.set("#s1-no", { opacity: 1 }, B(2));
      tl.fromTo("#s1-no", { x: 380 }, { x: 0, duration: 0.4, ease: "expo.out" }, B(2));
      /* beat 3 · CONDUCES. — heavy rise with a tilt */
      tl.set("#s1-conduces", { opacity: 1 }, B(3));
      tl.fromTo("#s1-conduces", { y: 150, rotation: 4, transformOrigin: "0% 100%" },
        { y: 0, rotation: 0, duration: 0.5, ease: "circ.out" }, B(3));

      /* beats 5-6 · crossed out by hand, forward then back */
      tl.to("#s1-strike-1", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, B(5));
      tl.to("#s1-strike-2", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, B(6));

      /* beat 7 · the struck line steps back into the corner */
      tl.to("#s1-a", { x: -60, y: -150, scale: 0.36, opacity: 0.4, duration: 0.5, ease: "power3.inOut" }, B(7));

      /* ---- PHASE B ---- */
      /* beat 8 · PERO — slams out of depth */
      tl.set("#s1-pero", { opacity: 1 }, B(8));
      tl.fromTo("#s1-pero", { scale: 2.4, filter: "blur(20px)" },
        { scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, B(8));

      /* beat 9 · DECIDES. — streaks in from the left, sharp on arrival */
      tl.set("#s1-dec", { opacity: 1 }, B(9));
      tl.fromTo("#s1-dec", { x: -1100 }, { x: 0, duration: 0.5, ease: "expo.out" }, B(9));
      tl.fromTo("#s1-streak-blur", { attr: { stdDeviation: "26 0" } }, { attr: { stdDeviation: "0 0" }, duration: 0.5, ease: "expo.out" }, B(9));

      /* beat 11 · hand-drawn ring around the decision (accent: the one overshoot) */
      tl.to("#s1-ring", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, B(11));

      /* beat 12 · a single pump on the downbeat */
      tl.to(["#s1-pero", "#s1-dec"], { scale: 1.045, duration: 0.12, ease: "power2.out" }, B(12));
      tl.to(["#s1-pero", "#s1-dec"], { scale: 1, duration: 0.34, ease: "power2.inOut" }, B(12) + 0.12);

      /* beats 14-16 · the ring gives way to the iris that becomes scene 02's ground */
      tl.to("#s1-ring", { opacity: 0, duration: 0.3, ease: "power1.in" }, B(14));
      tl.fromTo("#s1-iris", { scale: 0 }, { scale: 13, duration: 0.9, ease: "power3.in" }, B(14));

      window.__timelines["s01-gancho"] = tl;
    })();
