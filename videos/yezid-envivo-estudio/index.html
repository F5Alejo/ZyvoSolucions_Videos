<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>En Vivo PESV · estudio virtual</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <link rel="stylesheet" href="css/stage.css" />
  <link rel="stylesheet" href="css/player.css" />
</head>
<body>
  <div id="app">
    <!-- ═════════════ LIENZO 1080×1920 (lo que se renderiza) ═════════════ -->
    <div id="viewport">
      <div id="stage" data-composition-id="yezid-envivo-estudio" data-width="1080" data-height="1920" data-duration="12">
        <canvas id="bg"></canvas>

        <div id="contenido">
          <div class="eyebrow cristal" id="eyebrow"><i class="latido"></i><b data-t="evento"></b><span data-t="subEvento"></span></div>

          <!-- foto del Dr. Yezid en cristal premium (blur 20 px, borde de luz arriba a la izquierda) -->
          <div class="flota" id="foto-flota">
            <div class="foto-card cristal-premium" id="foto-card">
              <div class="foto-luz"></div>
              <img class="foto" id="foto" alt="Dr. Yezid Ricaurte" />
              <div class="en-vivo" id="en-vivo"><i></i>EN VIVO</div>
            </div>
            <div class="nombre cristal" id="nombre"><b data-t="persona"></b><span data-t="rol"></span></div>
          </div>

          <!-- mensaje -->
          <div id="mensaje">
            <h1 class="titular" id="titular"></h1>
            <p class="subtitulo" id="subtitulo"></p>
            <div class="info" id="info"></div>
          </div>

          <!-- llamado a la acción -->
          <div id="cierre">
            <div class="flota boton-caja" id="boton-flota"><div class="boton" id="boton"></div></div>
            <p class="sub" id="sub"></p>
            <img class="firma" id="firma" src="assets/firma-yezid-blanca.png" alt="Yezid Ricaurte" />
            <p class="web" data-t="web"></p>
          </div>
        </div>

        <div class="progreso"><i></i></div>
        <!-- VOZ: assets/voz/v1.mp3 · v2.mp3 · v3.mp3 (ElevenLabs). El reproductor la usa como reloj. -->
        <audio id="voz" preload="auto"></audio>
      </div>
    </div>

    <!-- ═════════════ CONTROLES (no se renderizan) ═════════════ -->
    <aside id="panel">
      <header>
        <img src="assets/firma-yezid-blanca.png" alt="Yezid Ricaurte" />
        <p>En Vivo PESV · estudio virtual · 9:16 · 12 s</p>
      </header>
      <nav id="tabs">
        <button data-v="v1">1 · Faltan pocos días</button>
        <button data-v="v2">2 · Es mañana</button>
        <button data-v="v3">3 · Es hoy</button>
      </nav>
      <nav id="fondos">
        <button data-fondo="escudo">Fondo: escudo 3D</button>
        <button data-fondo="plexus">Fondo: red geométrica</button>
      </nav>
      <div id="transport">
        <button id="play" aria-label="Reproducir">▶</button>
        <button id="restart" aria-label="Reiniciar">⟲</button>
        <span id="clock">0.00 s</span>
        <label class="chk"><input type="checkbox" id="loop" checked /> bucle</label>
        <span id="audio-state">voz: —</span>
      </div>
      <input type="range" id="range" min="0" max="12" step="0.01" value="0" />
      <section id="guion"></section>
      <p class="hint">Textos, colores y tiempos: <code>js/config.js</code> · Espacio: reproducir · ← →: ±0.1 s</p>
    </aside>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
