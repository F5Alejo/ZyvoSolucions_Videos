<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: "Montserrat"; font-style: normal; font-weight: 100 900; font-display: block;
      src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: "Montserrat"; font-style: normal; font-weight: 100 900; font-display: block;
      src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Montserrat", sans-serif; }
    .s3-layer { position: absolute; inset: 0; }
    .s3-ground { background: radial-gradient(900px 1100px at 50% 45%, #FFFFFF 0%, #F5F8FC 60%, #E9F1FA 100%); }

    .s3-head { position: absolute; left: 0; width: 1080px; top: 330px; text-align: center; }
    .s3-h1 { display: inline-block; font-size: 86px; font-weight: 900; line-height: 1.1; letter-spacing: -0.01em; padding: 0 10px; white-space: nowrap;
      background: linear-gradient(90deg, #0B2F6B 0%, #0B2F6B 40%, #5AA7E8 50%, #0B2F6B 60%, #0B2F6B 100%);
      background-size: 300% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent; }
    .s3-h2 { position: absolute; left: 0; width: 1080px; top: 560px; text-align: center; font-size: 52px; font-weight: 700; color: #1565C0; white-space: nowrap; }
    .s3-h2 span { display: inline-block; }

    /* five roles, two rows, assembled out of a 3D cloud */
    .s3-cloud-root { position: absolute; left: 60px; top: 720px; width: 960px; height: 300px; perspective: 1400px; }
    .s3-cloud { position: absolute; inset: 0; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 26px; transform-style: preserve-3d; }
    .s3-chip {
      position: relative; padding: 20px 28px; border-radius: 999px; background: #FFFFFF;
      border: 3px solid #0B2F6B; font-size: 40px; font-weight: 800; color: #0B2F6B; white-space: nowrap; line-height: 1;
      transform-style: preserve-3d; backface-visibility: hidden; opacity: 0; will-change: transform, opacity;
    }
    .s3-ul { position: absolute; left: 16px; right: 16px; bottom: -16px; height: 7px; border-radius: 4px; background: #5AA7E8; transform: scaleX(0); transform-origin: 0 50%; }

    .s3-band { position: absolute; left: 0; top: 1180px; width: 1080px; height: 110px; background: #0B2F6B; overflow: hidden; transform-origin: 50% 50%; }
    .s3-band-text { position: absolute; left: 0; top: 30px; font-size: 46px; font-weight: 800; letter-spacing: 0.06em; color: #FFFFFF; white-space: nowrap; line-height: 1; }
    .s3-band-text b { color: #5AA7E8; font-weight: 900; padding: 0 20px; }

    .s3-wipe { position: absolute; inset: 0; background: #0B2F6B; clip-path: polygon(0 120%, 100% 105%, 100% 140%, 0 140%); }
  </style>

  <div id="root" data-composition-id="s03-roles" data-start="0" data-duration="10" data-width="1080" data-height="1920">
    <div id="s3-ground" class="clip s3-layer s3-ground" data-start="0" data-duration="10" data-track-index="0"></div>

    <div id="s3-stage" class="clip s3-layer" data-start="0" data-duration="10" data-track-index="1">
      <div class="s3-head"><span class="s3-h1" id="s3-h1a">Todos los</span></div>
      <div class="s3-head" style="top: 430px"><span class="s3-h1" id="s3-h1b">colaboradores.</span></div>
      <div class="s3-h2" id="s3-h2"><span id="s3-h2a">Sin importar el cargo.</span></div>

      <div class="s3-band" id="s3-band">
        <div class="s3-band-text" id="s3-band-text">PEATÓN<b>·</b>CICLISTA<b>·</b>MOTOCICLISTA<b>·</b>CONDUCTOR<b>·</b>PASAJERO<b>·</b>PEATÓN<b>·</b>CICLISTA<b>·</b>MOTOCICLISTA<b>·</b>CONDUCTOR<b>·</b>PASAJERO<b>·</b>PEATÓN<b>·</b>CICLISTA</div>
      </div>

      <div class="s3-cloud-root">
        <div class="s3-cloud" id="s3-cloud">
          <div class="s3-chip">PEATÓN<span class="s3-ul" aria-hidden="true" data-layout-ignore></span></div>
          <div class="s3-chip">CICLISTA<span class="s3-ul" aria-hidden="true" data-layout-ignore></span></div>
          <div class="s3-chip">MOTOCICLISTA<span class="s3-ul" aria-hidden="true" data-layout-ignore></span></div>
          <div class="s3-chip">CONDUCTOR<span class="s3-ul" aria-hidden="true" data-layout-ignore></span></div>
          <div class="s3-chip s3-pas" id="s3-pas">PASAJERO<span class="s3-ul" aria-hidden="true" data-layout-ignore></span></div>
        </div>
      </div>

      <div class="s3-wipe" id="s3-wipe" aria-hidden="true" data-layout-ignore></div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var P = 0.5;
      function B(n) { return n * P; }

      /* beat 0 · the headline opens like a curtain, line by line */
      tl.fromTo("#s3-h1a", { clipPath: "inset(0 50% 0 50%)" }, { clipPath: "inset(0 0% 0 0%)", duration: 0.5, ease: "expo.out" }, B(0));
      tl.fromTo("#s3-h1b", { clipPath: "inset(0 50% 0 50%)" }, { clipPath: "inset(0 0% 0 0%)", duration: 0.5, ease: "expo.out" }, B(0) + 0.12);
      tl.fromTo(["#s3-h1a", "#s3-h1b"], { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power1.inOut" }, B(1));
      tl.fromTo("#s3-h2a", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, B(2));

      tl.fromTo("#s3-band", { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power4.out" }, B(3));
      tl.fromTo("#s3-band-text", { x: 0 }, { x: -1500, duration: 10 - B(3), ease: "none" }, B(3));

      /* beats 3-6 · depth scatter -> assemble, back into their own places in the two rows */
      var chips = gsap.utils.toArray("#s3-cloud .s3-chip");
      var n = chips.length, GOLDEN = Math.PI * (3 - Math.sqrt(5));
      var RADIUS = 420, Z_NEAR = 420, Z_FAR = -480, TUMBLE = 75;
      tl.fromTo("#s3-cloud", { rotationY: -24 }, { rotationY: 0, duration: 1.6, ease: "power2.out" }, B(3));
      chips.forEach(function (el, i) {
        var a = i * GOLDEN + 0.6, dt = i / (n - 1);
        tl.fromTo(el, { x: Math.cos(a) * RADIUS, y: Math.sin(a) * RADIUS * 0.8, z: Z_NEAR - dt * (Z_NEAR - Z_FAR),
            rotationX: Math.sin(a) * TUMBLE, rotationY: Math.cos(a) * TUMBLE, opacity: 0 },
          { x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, B(3) + i * 0.07);
      });

      /* beats 8-12 · the marker runs role by role, one per beat */
      var uls = gsap.utils.toArray("#s3-cloud .s3-ul");
      for (var k = 0; k < 5; k++) {
        tl.fromTo(uls[k], { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.25, ease: "expo.out", immediateRender: false }, B(8 + k));
        if (k < 4) tl.fromTo(uls[k], { scaleX: 1, transformOrigin: "100% 50%" }, { scaleX: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, B(9 + k));
      }
      tl.fromTo(uls[4], { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, B(13));
      tl.to(chips.slice(0, 4), { opacity: 0.35, duration: 0.3, ease: "power2.out" }, B(13));
      tl.to("#s3-pas", { scale: 1.16, backgroundColor: "#E6423C", borderColor: "#E6423C", color: "#FFFFFF", duration: 0.45, ease: "power4.out" }, B(13));

      /* beats 18-20 · exit: navy sweeps up from the floor on a slant */
      tl.to("#s3-wipe", { clipPath: "polygon(0 -20%, 100% -40%, 100% 140%, 0 140%)", duration: 0.7, ease: "power3.in" }, B(18) + 0.3);

      window.__timelines["s03-roles"] = tl;
    })();
  </script>
