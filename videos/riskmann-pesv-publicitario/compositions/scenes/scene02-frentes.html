  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var RM = window.RM;

      /* los cuatro cuadrantes entran escalonados */
      for (var i = 0; i < 4; i++) {
        tl.fromTo("#s2-c" + i, { opacity: 0, scale: 0.86 },
          { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.5)" }, 0.10 + i * 0.13);

        /* pulse(1 -> 1.08) con desfase por cuadrante: el desfase sale del hash,
           no de Math.random(), para que el render sea reproducible */
        RM.pulse(tl, "#s2-c" + i, 1, 1.08, 0.30, 4, 0.75, i);

        /* el borde alterna azul <-> oro, con offset distinto por cuadrante */
        for (var c = 0; c < 4; c++) {
          var t = 0.8 + i * 0.12 + c * 1.0;
          tl.to("#s2-c" + i, { borderColor: "#c8951a", duration: 0.25, ease: "none" }, t);
          tl.to("#s2-c" + i, { borderColor: "#333366", duration: 0.25, ease: "none" }, t + 0.5);
        }
      }

      /* 1.5 s · el "24" aparece con pop-in y cuenta hasta su valor */
      tl.set("#s2-num", { opacity: 1 }, 1.5);
      tl.fromTo("#s2-num", { scale: 0 },
        { scale: 1.15, duration: 0.16, ease: "power3.out" }, 1.5);
      tl.to("#s2-num", { scale: 1, duration: 0.09, ease: "power2.inOut" }, 1.66);
      RM.countUp(tl, "#s2-num", 0, 24, 0.55, 1.5);

      tl.fromTo("#s2-pie", { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.95);

      /* 3.6 s · SALIDA convergeFlash: los cuadrantes colapsan al centro y un
         fotograma de flash blanco antes del corte */

      tl.to(["#s2-num", "#s2-pie"], { scale: 0, opacity: 0, duration: 0.20, ease: "power3.in" }, 3.60);
      tl.to("#s2-flash", { opacity: 1, duration: 0.02, ease: "none" }, 3.80);
      tl.to("#s2-flash", { opacity: 0, duration: 0.04, ease: "none" }, 3.86);

      window.__timelines["scene02-frentes"] = tl;
