<template>
  <!-- ==================================================================
       Scene01_Hook · 4 s
       VO: "¿Coordinas el PESV de tu empresa... tú solo?"  [urgencia]
       Fuente del texto: la landing dice "Coordinas el PESV de tu empresa solo."
       Salida: glitchCollapse

       SIN FIGURA HUMANA. El prompt pedia un icono de persona; el manual de
       marca lo prohibe (§0.2). En su lugar: una reticula de nodos conectados
       con UNO suelto y rojo fuera de ella. Dice "solo" sin dibujar a nadie.
       ================================================================== -->
  <style>
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden;
            background: var(--negro); font-family: var(--fuente); color: var(--blanco); }
    .s1-capa { position: absolute; inset: 0; }

    /* noiseGrain(10%) — feTurbulence, constante toda la escena */
    #s1-grano { opacity: 0.10; mix-blend-mode: screen; }

    #s1-halo {
      position: absolute; left: 50%; top: 1420px; width: 900px; height: 900px;
      margin-left: -450px; margin-top: -450px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,51,51,0.40) 0%, rgba(2,2,2,0) 62%);
      opacity: 0.2;
    }

    #s1-hero { position: absolute; left: 0; top: 700px; width: 1080px; text-align: center; }
    .s1-solo {
      display: inline-block; font-size: var(--hero); font-weight: 700;
      line-height: var(--alto-linea); letter-spacing: -0.04em; color: var(--blanco);
    }
    /* copias para la aberracion cromatica del glitch */
    .rm-glitch-r, .rm-glitch-c {
      position: absolute; left: 0; top: 0; width: 1080px; text-align: center;
      opacity: 0; pointer-events: none;
    }
    .rm-glitch-r .s1-solo { color: var(--rojo); }
    .rm-glitch-c .s1-solo { color: var(--cian); }

    #s1-pregunta {
      position: absolute; left: 120px; top: 980px; width: 840px; text-align: center;
      font-size: var(--ui); font-weight: 300; line-height: var(--alto-linea);
      color: var(--gris-txt); opacity: 0;
    }

    /* la reticula: nodos conectados, y uno suelto */
    #s1-red { position: absolute; left: 50%; top: 1300px; margin-left: -270px; opacity: 0; }
    .s1-nodo { fill: none; stroke: var(--azul-tec); stroke-width: 3; }
    .s1-linea { stroke: var(--azul-tec); stroke-width: 2; opacity: 0.55; }
    #s1-suelto { fill: none; stroke: var(--rojo); stroke-width: 4; }

    /* particulas del glitchCollapse */
    .s1-part { position: absolute; width: 10px; height: 10px; background: var(--blanco); opacity: 0; }
  </style>

  <div id="root" data-composition-id="scene01-hook" data-start="0" data-duration="4"
       data-width="1080" data-height="1920">

    <div class="clip s1-capa" id="s1-fondo" data-start="0" data-duration="4" data-track-index="0"
         style="background: var(--negro);"></div>

    <svg class="clip s1-capa" id="s1-grano" data-start="0" data-duration="4" data-track-index="1"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true" data-layout-ignore>
      <filter id="s1-turb">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="1080" height="1920" filter="url(#s1-turb)"/>
    </svg>

    <div class="clip" id="s1-halo" data-layout-allow-overflow data-start="0" data-duration="4" data-track-index="2"></div>

    <div class="clip" id="s1-hero" data-start="0" data-duration="4" data-track-index="3">
      <span class="s1-solo" id="s1-solo">SOLO</span>
      <div class="rm-glitch-r" aria-hidden="true" data-layout-ignore><span class="s1-solo">SOLO</span></div>
      <div class="rm-glitch-c" aria-hidden="true" data-layout-ignore><span class="s1-solo">SOLO</span></div>
    </div>

    <div class="clip" id="s1-pregunta" data-start="0" data-duration="4" data-track-index="4">
      ¿Coordinas el PESV de tu empresa?
    </div>

    <svg class="clip" id="s1-red" width="540" height="200" viewBox="0 0 540 200"
         data-start="0" data-duration="4" data-track-index="5" aria-hidden="true" data-layout-ignore>
      <line class="s1-linea" x1="150" y1="60" x2="270" y2="60"/>
      <line class="s1-linea" x1="270" y1="60" x2="390" y2="60"/>
      <line class="s1-linea" x1="150" y1="60" x2="270" y2="140"/>
      <line class="s1-linea" x1="390" y1="60" x2="270" y2="140"/>
      <circle class="s1-nodo" cx="150" cy="60" r="18"/>
      <circle class="s1-nodo" cx="270" cy="60" r="18"/>
      <circle class="s1-nodo" cx="390" cy="60" r="18"/>
      <circle class="s1-nodo" cx="270" cy="140" r="18"/>
      <circle id="s1-suelto" cx="60" cy="150" r="22"/>
    </svg>

    <div class="clip s1-capa" id="s1-particulas" data-start="0" data-duration="4" data-track-index="6"
         aria-hidden="true" data-layout-ignore>
      <div class="s1-part" id="s1-p0" style="left:470px; top:760px"></div>
      <div class="s1-part" id="s1-p1" style="left:510px; top:800px"></div>
      <div class="s1-part" id="s1-p2" style="left:550px; top:770px"></div>
      <div class="s1-part" id="s1-p3" style="left:590px; top:810px"></div>
      <div class="s1-part" id="s1-p4" style="left:630px; top:780px"></div>
      <div class="s1-part" id="s1-p5" style="left:430px; top:800px"></div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var RM = window.RM;

      /* 0.3 s · el texto aparece: fade + scale 0.9 -> 1 */
      tl.fromTo("#s1-solo", { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0.3);
      tl.fromTo("#s1-pregunta", { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.75);

      /* la reticula entra y el nodo suelto queda aparte */
      tl.fromTo("#s1-red", { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.0);

      /* 0.5 -> 3.5 s · shake de 2 px a alta frecuencia sobre el titular */
      RM.shake(tl, "#s1-hero", 2, 14, 3.0, 0.5);

      /* el halo late todo el rato: 0.2 <-> 0.4, ciclos de 800 ms.
         Ciclos finitos, nunca repeat:-1 — el render busca por tiempo. */
      for (var i = 0; i < 5; i++) {
        tl.to("#s1-halo", { opacity: 0.4, duration: 0.4, ease: "sine.inOut" }, i * 0.8);
        tl.to("#s1-halo", { opacity: 0.2, duration: 0.4, ease: "sine.inOut" }, i * 0.8 + 0.4);
      }
      /* el nodo suelto parpadea con el halo: es el que esta "solo" */
      for (var j = 0; j < 5; j++) {
        tl.to("#s1-suelto", { opacity: 0.35, duration: 0.4, ease: "sine.inOut" }, j * 0.8);
        tl.to("#s1-suelto", { opacity: 1, duration: 0.4, ease: "sine.inOut" }, j * 0.8 + 0.4);
      }

      /* 3.5 s · SALIDA glitchCollapse: aberracion cromatica y el texto se
         fragmenta en particulas que se dispersan y caen */
      RM.glitch(tl, "#s1-hero", 14, 0.35, 3.45);
      tl.to(["#s1-pregunta", "#s1-red"],
        { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.5);

      for (var k = 0; k < 6; k++) {
        var dx = (RM.azar(k, 21) * 2 - 1) * 260;
        tl.set("#s1-p" + k, { opacity: 1 }, 3.72);
        tl.to("#s1-p" + k, {
          x: dx, y: 300 + RM.azar(k, 22) * 180, opacity: 0, scale: 0.4,
          duration: 0.28, ease: "power2.in"
        }, 3.72);
      }
      tl.to("#s1-solo", { opacity: 0, scale: 1.25, duration: 0.2, ease: "power2.in" }, 3.72);

      window.__timelines["scene01-hook"] = tl;
    })();
  </script>
</template>
