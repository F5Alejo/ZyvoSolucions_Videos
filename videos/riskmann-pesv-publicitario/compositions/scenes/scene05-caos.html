                  0 102px 0 rgba(2,2,2,0.10);

  <div id="root" data-composition-id="scene05-caos" data-start="0" data-duration="4"

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var RM = window.RM;

      /* los seis papeles se revuelven solos: jitter continuo, sin manos */
      for (var i = 0; i < 6; i++) {
        RM.jitter(tl, "#s5-p" + i, 14, 26, 3.4, 0.1, i);

        /* algunos parpadean, como si aparecieran y desaparecieran de la busqueda */
        if (i % 2 === 0) {
          for (var c = 0; c < 4; c++) {
            var t = 0.3 + c * 0.75 + RM.azar(i, 41) * 0.25;
            tl.to("#s5-p" + i, { opacity: 0.35, duration: 0.12, ease: "none" }, t);
            tl.to("#s5-p" + i, { opacity: 1, duration: 0.12, ease: "none" }, t + 0.12);
          }
        }
      }

      /* la arena cae rapido durante los 4 s */
      tl.fromTo("#s5-arena", { scaleY: 1 },
        { scaleY: 0, duration: 3.5, ease: "power1.in" }, 0.1);

      tl.fromTo("#s5-texto", { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.0);

      /* 3.98 s · SALIDA hardCut: corte seco a negro, sin easing ni fotograma
         intermedio. El contraste es justo lo que prepara el giro de la 6. */
      tl.set("#s5-negro", { opacity: 1 }, 3.98);

      window.__timelines["scene05-caos"] = tl;
    })();
